
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 专业星图</title>
    <link href="https://fonts.googleapis.com/css2?family=Literata:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --surface: #FFF8F5;
            --surface-container: #FFFFFF;
            --primary: #E67E22;
            --primary-container: #FAD7B2;
            --secondary: #705A49;
            --secondary-container: #EBE0D6;
            --on-surface: #2C2621;
            --on-primary: #FFFFFF;
            --on-surface-variant: #8B7E74;
            --outline: #DED0C6;
            --shadow: rgba(112, 90, 73, 0.05);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
            background: var(--surface);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            max-width: 480px;
            width: 100%;
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .logo-title {
            font-family: 'Literata', serif;
            font-size: 36px;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 8px;
        }
        
        .logo-subtitle {
            color: var(--on-surface-variant);
            font-size: 14px;
        }
        
        .login-card {
            background: var(--surface-container);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 4px 24px var(--shadow);
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--secondary);
            margin-bottom: 8px;
        }
        
        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--outline);
            border-radius: 16px;
            font-size: 16px;
            background: var(--surface);
            color: var(--on-surface);
            outline: none;
            transition: all 0.3s;
        }
        
        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(230, 126, 34, 0.1);
        }
        
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #E67E22 0%, #D35400 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(230, 126, 34, 0.4);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
        }
        
        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--outline);
        }
        
        .divider-text {
            padding: 0 16px;
            color: var(--on-surface-variant);
            font-size: 14px;
        }
        
        .btn-wechat {
            width: 100%;
            padding: 14px;
            background: #07C160;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-wechat:hover {
            background: #06AD56;
            transform: translateY(-2px);
        }
        
        .link-section {
            text-align: center;
            margin-top: 24px;
        }
        
        .link-text {
            color: var(--on-surface-variant);
            font-size: 14px;
        }
        
        .link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        
        .link:hover {
            text-decoration: underline;
        }
        
        .error-message {
            background: #FFEBEE;
            color: #C62828;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .success-message {
            background: #E8F5E9;
            color: #2E7D32;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--on-surface-variant);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
            transition: color 0.3s;
        }
        
        .back-link:hover {
            color: var(--primary);
        }
        
        @media (max-width: 768px) {
            .login-card {
                padding: 32px 24px;
            }
            
            .logo-title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <a href="index.html" class="back-link">
            <span>←</span> 返回首页
        </a>
        
        <div class="logo-section">
            <h1 class="logo-title">专业星图</h1>
            <p class="logo-subtitle">温暖、专业的大学专业选择指南</p>
        </div>
        
        <div class="login-card">
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="phone">手机号</label>
                    <input type="tel" id="phone" class="form-input" placeholder="请输入手机号" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">密码</label>
                    <input type="password" id="password" class="form-input" placeholder="请输入密码" required>
                </div>
                
                <button type="submit" class="btn-primary" id="loginBtn">登录</button>
            </form>
            
            <div class="divider">
                <div class="divider-line"></div>
                <span class="divider-text">或</span>
                <div class="divider-line"></div>
            </div>
            
            <button class="btn-wechat" id="wechatLoginBtn">
                <span>💬</span> 微信登录
            </button>
            
            <div class="link-section">
                <span class="link-text">还没有账号？</span>
                <a href="register.html" class="link">立即注册</a>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            const wechatLoginBtn = document.getElementById('wechatLoginBtn');
            
            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.classList.add('show');
                successMessage.classList.remove('show');
            }
            
            function showSuccess(message) {
                successMessage.textContent = message;
                successMessage.classList.add('show');
                errorMessage.classList.remove('show');
            }
            
            function clearMessages() {
                errorMessage.classList.remove('show');
                successMessage.classList.remove('show');
            }
            
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearMessages();
                
                const phone = document.getElementById('phone').value.trim();
                const password = document.getElementById('password').value;
                
                if (!phone || !password) {
                    showError('请填写手机号和密码');
                    return;
                }
                
                loginBtn.disabled = true;
                loginBtn.textContent = '登录中...';
                
                try {
                    await auth.loginWithPhone(phone, password);
                    showSuccess('登录成功！即将跳转...');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } catch (error) {
                    console.error('Login error:', error);
                    showError(error.message || '登录失败，请检查手机号和密码');
                } finally {
                    loginBtn.disabled = false;
                    loginBtn.textContent = '登录';
                }
            });
            
            wechatLoginBtn.addEventListener('click', () => {
                alert('微信登录功能即将上线，敬请期待！');
            });
            
            auth.checkAuthState(async (session) => {
                if (session) {
                    window.location.href = 'index.html';
                }
            });
        });
    </script>
</body>
</html>
