<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 专业星图</title>
  <link rel="stylesheet" href="css/auth.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .form-panel {
      display: none;
    }
    .form-panel.active {
      display: flex;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="logo-icon">🌟</span>
        <h1>专业星图</h1>
        <p class="subtitle">探索宇宙之美</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="phone" onclick="switchTab('phone')">
          📱 手机号登录
        </button>
        <button class="auth-tab" data-tab="email" onclick="switchTab('email')">
          ✉️ 邮箱登录
        </button>
      </div>

      <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-panel active" id="phonePanel">
          <div class="form-group">
            <label for="phone">手机号</label>
            <input 
              type="tel" 
              id="phone" 
              name="phone" 
              placeholder="请输入手机号"
              autocomplete="tel"
              required
            >
            <span class="form-error" id="phoneError"></span>
          </div>

          <div class="form-group">
            <label for="phonePassword">密码</label>
            <input 
              type="password" 
              id="phonePassword" 
              name="password" 
              placeholder="请输入密码"
              autocomplete="current-password"
              required
            >
            <span class="form-error" id="phonePasswordError"></span>
          </div>
        </div>

        <div class="form-panel" id="emailPanel">
          <div class="form-group">
            <label for="email">邮箱</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              placeholder="请输入邮箱"
              autocomplete="email"
              required
            >
            <span class="form-error" id="emailError"></span>
          </div>

          <div class="form-group">
            <label for="emailPassword">密码</label>
            <input 
              type="password" 
              id="emailPassword" 
              name="password" 
              placeholder="请输入密码"
              autocomplete="current-password"
              required
            >
            <span class="form-error" id="emailPasswordError"></span>
          </div>
        </div>

        <div class="remember-forgot">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe">
            <span>记住我</span>
          </label>
          <a href="forgot-password.html" class="forgot-link">忘记密码？</a>
        </div>

        <button type="submit" class="auth-button" id="submitBtn">
          登录
        </button>

        <div class="auth-footer">
          <p>还没有账号？<a href="register.html">立即注册</a></p>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast">
    <span class="toast-icon">✓</span>
    <div class="toast-content">
      <div class="toast-title">成功</div>
      <div class="toast-message" id="toastMessage"></div>
    </div>
    <button class="toast-close" onclick="hideToast()">×</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://your-project.supabase.co';
    const SUPABASE_ANON_KEY = 'your-anon-key';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentTab = 'phone';

    function switchTab(tab) {
      currentTab = tab;
      
      document.querySelectorAll('.auth-tab').forEach(t => {
        t.classList.remove('active');
      });
      document.querySelector(`[data-tab="${tab}"]`).classList.add('active');

      document.querySelectorAll('.form-panel').forEach(panel => {
        panel.classList.remove('active');
      });
      
      if (tab === 'phone') {
        document.getElementById('phonePanel').classList.add('active');
      } else {
        document.getElementById('emailPanel').classList.add('active');
      }

      clearErrors();
    }

    function clearErrors() {
      document.querySelectorAll('.form-error').forEach(error => {
        error.classList.remove('show');
        error.textContent = '';
      });
      document.querySelectorAll('.form-group').forEach(group => {
        group.classList.remove('error');
      });
    }

    function showError(fieldId, message) {
      const errorElement = document.getElementById(fieldId + 'Error');
      const formGroup = document.getElementById(fieldId).closest('.form-group');
      
      if (errorElement) {
        errorElement.textContent = message;
        errorElement.classList.add('show');
      }
      
      if (formGroup) {
        formGroup.classList.add('error');
      }
    }

    function validatePhone(phone) {
      const phoneRegex = /^1[3-9]\d{9}$/;
      return phoneRegex.test(phone);
    }

    function validateEmail(email) {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return emailRegex.test(email);
    }

    function validatePassword(password) {
      return password.length >= 6;
    }

    function showToast(type, title, message) {
      const toast = document.getElementById('toast');
      const toastIcon = toast.querySelector('.toast-icon');
      const toastTitle = toast.querySelector('.toast-title');
      const toastMessage = document.getElementById('toastMessage');

      toast.className = 'toast ' + type;
      toastTitle.textContent = title;
      toastMessage.textContent = message;

      if (type === 'success') {
        toastIcon.textContent = '✓';
      } else if (type === 'error') {
        toastIcon.textContent = '✕';
      }

      toast.classList.remove('hide');
      toast.classList.add('show');

      setTimeout(() => {
        hideToast();
      }, 3000);
    }

    function hideToast() {
      const toast = document.getElementById('toast');
      toast.classList.remove('show');
      toast.classList.add('hide');
    }

    function setButtonLoading(loading) {
      const btn = document.getElementById('submitBtn');
      if (loading) {
        btn.classList.add('loading');
        btn.disabled = true;
        btn.textContent = '登录中...';
      } else {
        btn.classList.remove('loading');
        btn.disabled = false;
        btn.textContent = '登录';
      }
    }

    async function handleLogin(event) {
      event.preventDefault();
      clearErrors();

      let isValid = true;
      let loginData = {};

      if (currentTab === 'phone') {
        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('phonePassword').value;

        if (!phone) {
          showError('phone', '请输入手机号');
          isValid = false;
        } else if (!validatePhone(phone)) {
          showError('phone', '手机号格式不正确');
          isValid = false;
        }

        if (!password) {
          showError('phonePassword', '请输入密码');
          isValid = false;
        } else if (!validatePassword(password)) {
          showError('phonePassword', '密码至少6位');
          isValid = false;
        }

        if (isValid) {
          loginData = {
            phone: phone,
            password: password
          };
        }
      } else {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('emailPassword').value;

        if (!email) {
          showError('email', '请输入邮箱');
          isValid = false;
        } else if (!validateEmail(email)) {
          showError('email', '邮箱格式不正确');
          isValid = false;
        }

        if (!password) {
          showError('emailPassword', '请输入密码');
          isValid = false;
        } else if (!validatePassword(password)) {
          showError('emailPassword', '密码至少6位');
          isValid = false;
        }

        if (isValid) {
          loginData = {
            email: email,
            password: password
          };
        }
      }

      if (!isValid) {
        return;
      }

      setButtonLoading(true);

      try {
        let session;

        if (currentTab === 'phone') {
          const { data, error } = await supabase.auth.signInWithPassword({
            phone: loginData.phone,
            password: loginData.password
          });

          if (error) throw error;
          session = data;
        } else {
          const { data, error } = await supabase.auth.signInWithPassword({
            email: loginData.email,
            password: loginData.password
          });

          if (error) throw error;
          session = data;
        }

        showToast('success', '登录成功', '正在跳转到首页...');

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1500);

      } catch (error) {
        console.error('登录失败:', error);
        
        let errorMessage = '登录失败，请稍后重试';
        
        if (error.message.includes('Invalid login credentials')) {
          errorMessage = '手机号/邮箱或密码错误';
        } else if (error.message.includes('not found')) {
          errorMessage = '该账户不存在';
        } else if (error.message.includes('rate limit')) {
          errorMessage = '登录尝试次数过多，请稍后再试';
        }

        showToast('error', '登录失败', errorMessage);
        setButtonLoading(false);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedTab = localStorage.getItem('loginTab');
      if (savedTab) {
        switchTab(savedTab);
      }

      const rememberedEmail = localStorage.getItem('rememberedEmail');
      if (rememberedEmail) {
        document.getElementById('email').value = rememberedEmail;
        document.getElementById('rememberMe').checked = true;
      }
    });

    const rememberCheckbox = document.getElementById('rememberMe');
    if (rememberCheckbox) {
      rememberCheckbox.addEventListener('change', (e) => {
        if (e.target.checked) {
          const email = document.getElementById('email').value;
          if (email) {
            localStorage.setItem('rememberedEmail', email);
          }
        } else {
          localStorage.removeItem('rememberedEmail');
        }
      });
    }

    window.switchTab = switchTab;
    window.hideToast = hideToast;
  </script>
</body>
</html>
