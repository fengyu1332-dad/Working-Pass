
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="登录专业星图，解锁深度专业报告，获取个性化专业推荐，探索你的大学专业方向。">
    <meta property="og:title" content="登录 - 专业星图">
    <meta property="og:description" content="登录专业星图，解锁深度专业报告。">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="zh_CN">
    <meta name="twitter:card" content="summary">
    <title>登录 - 专业星图</title>
    <link href="https://fonts.googleapis.com/css2?family=Literata:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --surface: #FFF8F5;
            --surface-container: #FFFFFF;
            --primary: #E67E22;
            --primary-container: #FAD7B2;
            --secondary: #705A49;
            --secondary-container: #EBE0D6;
            --on-surface: #2C2621;
            --on-primary: #FFFFFF;
            --on-surface-variant: #8B7E74;
            --outline: #DED0C6;
            --shadow: rgba(112, 90, 73, 0.05);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
            background: var(--surface);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            max-width: 480px;
            width: 100%;
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .logo-title {
            font-family: 'Literata', serif;
            font-size: 36px;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 8px;
        }
        
        .logo-subtitle {
            color: var(--on-surface-variant);
            font-size: 14px;
        }
        
        .login-card {
            background: var(--surface-container);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 4px 24px var(--shadow);
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--secondary);
            margin-bottom: 8px;
        }
        
        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--outline);
            border-radius: 16px;
            font-size: 16px;
            background: var(--surface);
            color: var(--on-surface);
            outline: none;
            transition: all 0.3s;
        }
        
        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(230, 126, 34, 0.1);
        }
        
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #E67E22 0%, #D35400 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(230, 126, 34, 0.4);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .link-section {
            text-align: center;
            margin-top: 24px;
        }
        
        .link-text {
            color: var(--on-surface-variant);
            font-size: 14px;
        }
        
        .link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        
        .link:hover {
            text-decoration: underline;
        }
        
        .error-message {
            background: #FFEBEE;
            color: #C62828;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .success-message {
            background: #E8F5E9;
            color: #2E7D32;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--on-surface-variant);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
            transition: color 0.3s;
        }
        
        .back-link:hover {
            color: var(--primary);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: var(--on-surface-variant);
            font-size: 13px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--outline);
        }
        .divider-text {
            padding: 0 16px;
        }

        .btn-google {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--outline);
            border-radius: 16px;
            background: var(--surface-container);
            color: var(--on-surface);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }
        .btn-google:hover {
            border-color: #4285F4;
            background: #F8FBFF;
        }
        .btn-google:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .login-card {
                padding: 32px 24px;
            }
            
            .logo-title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <div class="login-container" id="main-content">
        <a href="index.html" class="back-link">
            <span>←</span> 返回首页
        </a>
        
        <div class="logo-section">
            <h1 class="logo-title">专业星图</h1>
            <p class="logo-subtitle">温暖、专业的大学专业选择指南</p>
        </div>
        
        <div class="login-card">
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">邮箱</label>
                    <input type="email" id="email" class="form-input" placeholder="请输入邮箱地址" required autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">密码</label>
                    <input type="password" id="password" class="form-input" placeholder="请输入密码" required>
                </div>
                
                <button type="submit" class="btn-primary" id="loginBtn">登录</button>
            </form>

            <div class="divider">
                <span class="divider-text">或</span>
            </div>

            <button type="button" class="btn-google" id="googleLoginBtn">
                <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                使用 Google 账号登录
            </button>

            <div class="link-section">
                <span class="link-text">还没有账号？</span>
                <a href="register.html" class="link">立即注册</a>
            </div>
            <div class="link-section" style="margin-top:4px;">
                <a href="reset-password.html" class="link" style="font-size:13px;">忘记密码？</a>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
