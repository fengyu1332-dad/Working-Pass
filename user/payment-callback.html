<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>支付确认 - 专业星图</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .callback-container {
      max-width: 480px;
      margin: 80px auto;
      text-align: center;
    }
    .callback-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    .callback-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--secondary);
      margin-bottom: 12px;
    }
    .callback-text {
      color: var(--on-surface-variant);
      font-size: 15px;
      margin-bottom: 32px;
      line-height: 1.7;
    }
    .callback-spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 3px solid var(--outline);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .callback-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .callback-error {
      background: var(--error-container);
      color: var(--error);
      padding: 16px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="callback-container">
    <div class="callback-icon" style="font-size:64px;">🤝</div>
    <h1 class="callback-title" style="font-size:22px;font-weight:700;color:var(--secondary);">支付功能已升级</h1>
    <p class="callback-text" style="color:var(--on-surface-variant);font-size:15px;margin-bottom:16px;line-height:1.7;">
      点数获取方式已从「支付购买」升级为「邀请好友」。<br>
      每邀请一位朋友注册，你和他各获得点数和10点奖励。
    </p>
    <div class="callback-actions" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
      <a href="/user/dashboard.html" style="display:inline-block;padding:12px 28px;border-radius:12px;font-size:15px;font-weight:600;text-decoration:none;background:var(--primary);color:#fff;">前往个人中心获取邀请链接</a>
    </div>
  </div>
</body>
</html>
