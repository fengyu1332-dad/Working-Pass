<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>报告浏览 - 专业星图</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .search-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .search-bar .form-input {
      flex: 1;
    }

    .filter-toolbar {
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-label {
      color: var(--on-surface-variant);
      font-size: 14px;
      white-space: nowrap;
    }

    .filter-select {
      width: auto;
      min-width: 140px;
    }

    .reports-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .report-card {
      cursor: pointer;
      transition: all 0.3s;
    }

    .report-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 32px var(--shadow);
    }

    .report-code {
      display: inline-block;
      background: var(--secondary-container);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--secondary);
      margin-bottom: 12px;
    }

    .report-title {
      font-size: 19px;
      font-weight: 700;
      color: var(--secondary);
      margin-bottom: 8px;
    }

    .report-meta {
      display: flex;
      justify-content: space-between;
      color: var(--on-surface-variant);
      font-size: 13px;
      margin-top: 16px;
    }

    .report-preview {
      background: var(--secondary-container);
      border-radius: 12px;
      padding: 24px;
      margin: 24px 0;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.8;
    }

    .report-locked {
      text-align: center;
      padding: 32px;
      background: var(--secondary-container);
      border-radius: 12px;
      margin: 24px 0;
    }

    .report-locked-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .report-full {
      background: var(--surface-container-low);
      border-radius: 12px;
      padding: 24px;
      margin: 24px 0;
      max-height: 500px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.8;
    }

    .downloaded-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--success-container);
      color: var(--success);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      margin-left: 10px;
    }

    .download-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--on-surface-variant);
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 24px;
      transition: color 0.3s;
    }
    .back-link:hover { color: var(--primary); }

    .balance-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      padding: 14px 20px;
      background: linear-gradient(135deg, var(--primary-container), #FFE0B2);
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      color: var(--secondary);
    }
    .balance-bar span {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav">
      <a href="/" class="nav-logo">专业星图</a>
      <div class="nav-links">
        <a href="/user/dashboard.html" class="nav-link">个人中心</a>
        <a href="/user/purchase.html" class="nav-link">购买点数</a>
        <a href="/user/orders.html" class="nav-link">历史记录</a>
        <a href="#" id="logoutBtn" class="nav-link">退出</a>
      </div>
    </nav>

    <a href="/user/dashboard.html" class="back-link">← 返回个人中心</a>

    <h1 class="page-title">专业深度报告</h1>

    <div class="balance-bar">
      💎 当前点数余额：<span id="reportBalance">--</span>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" class="form-input" placeholder="搜索专业名称或代码...">
      <button class="btn btn-primary" id="searchBtn">搜索</button>
    </div>

    <div class="filter-toolbar">
      <div class="filter-group">
        <label for="categoryFilter" class="filter-label">学科分类：</label>
        <select id="categoryFilter" class="form-input filter-select">
          <option value="all">全部学科</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="reportSort" class="filter-label">排序：</label>
        <select id="reportSort" class="form-input filter-select">
          <option value="name">按名称</option>
          <option value="downloads">按解锁量</option>
          <option value="recent">按时间</option>
        </select>
      </div>
    </div>

    <div class="reports-grid" id="reportsGrid">
    </div>
  </div>

  <div class="modal" id="reportModal">
    <div class="modal-content" style="max-width: 700px;">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">报告详情</h2>
        <button class="modal-close" id="modalCloseBtn">&times;</button>
      </div>
      <div id="modalContent">
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="/js/pages/reports-page.js"></script>
</body>
</html>
