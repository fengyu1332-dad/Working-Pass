
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>报告浏览 - 专业星图</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .search-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
    }
    
    .search-bar .form-input {
      flex: 1;
    }
    
    .reports-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }
    
    .report-card {
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .report-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 32px var(--shadow);
    }
    
    .report-code {
      display: inline-block;
      background: var(--secondary-container);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--secondary);
      margin-bottom: 12px;
    }
    
    .report-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--secondary);
      margin-bottom: 8px;
    }
    
    .report-meta {
      display: flex;
      justify-content: space-between;
      color: var(--on-surface-variant);
      font-size: 14px;
      margin-top: 16px;
    }
    
    .report-detail {
      max-width: 700px;
    }
    
    .report-preview {
      background: var(--secondary-container);
      border-radius: 12px;
      padding: 24px;
      margin: 24px 0;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.8;
    }
    
    .report-locked {
      text-align: center;
      padding: 32px;
      background: var(--secondary-container);
      border-radius: 12px;
      margin: 24px 0;
    }
    
    .report-locked-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    
    .report-full {
      background: var(--surface-container-low);
      border-radius: 12px;
      padding: 24px;
      margin: 24px 0;
      max-height: 500px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.8;
    }
    
    .downloaded-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--success-container);
      color: var(--success);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
      margin-left: 12px;
    }
    
    .download-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav">
      <a href="/" class="nav-logo">专业星图</a>
      <div class="nav-links">
        <a href="/user/dashboard.html" class="nav-link">个人中心</a>
        <a href="/user/orders.html" class="nav-link">历史记录</a>
        <a href="#" id="logoutBtn" class="nav-link">退出</a>
      </div>
    </nav>

    <h1 class="page-title">专业深度报告</h1>
    <p class="page-subtitle">探索各个专业的详细分析报告</p>

    <div class="search-bar">
      <input type="text" id="searchInput" class="form-input" placeholder="搜索专业名称或代码...">
      <button class="btn btn-primary" onclick="searchReports()">搜索</button>
    </div>

    <div class="reports-grid" id="reportsGrid">
    </div>
  </div>

  <div class="modal" id="reportModal">
    <div class="modal-content report-detail">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">报告详情</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div id="modalContent">
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/reports.js"></script>
  <script>
    let currentReports = [];
    let currentProfile = null;
    let downloadedReports = new Set();
    let currentPdfUrl = null;
    let currentPdfName = null;
    
    (async function() {
      window.auth.initSupabase();
      
      const isLoggedIn = await window.auth.checkAuthAndRedirect();
      if (!isLoggedIn) return;
      
      currentProfile = await window.auth.getUserProfile();
      
      await loadReports();
      
      document.getElementById('logoutBtn').addEventListener('click', async (e) => {
        e.preventDefault();
        try {
          await window.auth.logout();
        } catch (error) {
          window.auth.showToast('退出失败', 'error');
        }
      });
    })();
    
    async function loadReports(search = null) {
      try {
        let reports = await window.reports.getReports(null, search);
        
        if (!reports || reports.length === 0) {
          reports = [
            { id: 1, major_code: '080901', major_name: '计算机科学与技术', category: '工学', preview_content: '本专业培养具有良好的科学素养，系统地、较好地掌握计算机科学与技术包括计算机硬件、软件与应用的基本理论、基本知识和基本技能与方法...', download_count: 1256, status: 'published' },
            { id: 2, major_code: '020301K', major_name: '金融学', category: '经济学', preview_content: '金融学专业培养具有全球视野、系统掌握金融理论知识和业务技能的复合型金融人才...', download_count: 987, status: 'published' },
            { id: 3, major_code: '100201K', major_name: '临床医学', category: '医学', preview_content: '临床医学专业培养掌握基础医学、临床医学的基本理论和医疗预防的基本技能的医学专门人才...', download_count: 856, status: 'published' }
          ];
        }
        
        currentReports = reports;
        
        for (const report of reports) {
          const isDownloaded = await window.reports.checkDownloaded(report.id);
          if (isDownloaded) {
            downloadedReports.add(report.id);
          }
        }
        
        renderReports(reports);
      } catch (error) {
        console.error('Load reports error:', error);
        window.auth.showToast('加载报告失败', 'error');
      }
    }
    
    function renderReports(reports) {
      const grid = document.getElementById('reportsGrid');
      
      if (reports.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 60px; color: var(--on-surface-variant);">
            暂无报告数据
          </div>
        `;
        return;
      }
      
      grid.innerHTML = reports.map(report => `
        <div class="card report-card" onclick="showReportDetail(${report.id})">
          <div class="report-code">${report.major_code}</div>
          <div class="report-title">
            ${report.major_name}
            ${downloadedReports.has(report.id) ? '<span class="downloaded-badge">✓ 已下载</span>' : ''}
          </div>
          <div style="color: var(--on-surface-variant); font-size: 14px; margin-bottom: 8px;">${report.category}</div>
          <div style="color: var(--on-surface-variant); font-size: 14px; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
            ${report.preview_content || ''}
          </div>
          <div class="report-meta">
            <span>下载 ${report.download_count || 0} 次</span>
            <span>消耗 1 点</span>
          </div>
        </div>
      `).join('');
    }
    
    function searchReports() {
      const search = document.getElementById('searchInput').value;
      loadReports(search);
    }
    
    async function showReportDetail(reportId) {
      const report = currentReports.find(r => r.id === reportId);
      if (!report) return;
      
      const modal = document.getElementById('reportModal');
      const title = document.getElementById('modalTitle');
      const content = document.getElementById('modalContent');
      
      title.textContent = report.major_name;
      currentPdfUrl = null;
      currentPdfName = null;
      
      const isDownloaded = downloadedReports.has(reportId);
      
      if (isDownloaded) {
        content.innerHTML = `
          <div class="report-code">${report.major_code}</div>
          <div style="color: var(--on-surface-variant); margin-bottom: 16px;">${report.category}</div>
          <div class="report-full" id="reportFullContent">加载中...</div>
          <div class="download-actions">
            <button class="btn btn-primary" id="downloadPdfBtn" onclick="downloadPdfFromModal()" style="display: none;">
              📄 下载PDF版
            </button>
            <button class="btn btn-secondary" onclick="closeModal()">关闭</button>
          </div>
        `;
        modal.classList.add('active');
        await loadFullReport(reportId, report);
      } else {
        content.innerHTML = `
          <div class="report-code">${report.major_code}</div>
          <div style="color: var(--on-surface-variant); margin-bottom: 16px;">${report.category}</div>
          
          <div class="report-preview">
            <div style="font-weight: 600; margin-bottom: 12px; color: var(--secondary);">👁️ 免费预览</div>
            ${report.preview_content || '暂无预览内容'}
          </div>
          
          <div class="report-locked">
            <div class="report-locked-icon">🔒</div>
            <div style="font-size: 18px; font-weight: 600; margin-bottom: 8px;">解锁完整报告</div>
            <div style="color: var(--on-surface-variant); margin-bottom: 24px;">
              您的点数: <span style="color: var(--primary); font-weight: 700; font-size: 24px;">${currentProfile?.points_balance || 0}</span>
            </div>
            <button class="btn btn-primary" onclick="downloadReportWrapper(${report.id})">
              消耗 1 点解锁完整报告
            </button>
            ${(currentProfile?.points_balance || 0) < 1 ? `
              <div style="margin-top: 16px;">
                <a href="/user/purchase.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">点数不足？去充值 →</a>
              </div>
            ` : ''}
          </div>
        `;
        modal.classList.add('active');
      }
    }
    
    async function loadFullReport(reportId, report) {
      try {
        const result = await window.reports.downloadReport(reportId);
        
        const contentEl = document.getElementById('reportFullContent');
        if (contentEl) {
          contentEl.textContent = result.text || '暂无内容';
        }
        
        currentPdfUrl = result.pdfUrl;
        if (result.pdfUrl) {
          currentPdfName = report?.pdf_url || `report_${reportId}.pdf`;
          const pdfBtn = document.getElementById('downloadPdfBtn');
          if (pdfBtn) {
            pdfBtn.style.display = 'inline-flex';
          }
        }
      } catch (error) {
        console.error('Load full report error:', error);
        const contentEl = document.getElementById('reportFullContent');
        if (contentEl) {
          contentEl.textContent = '加载失败: ' + (error.message || '未知错误');
        }
      }
    }
    
    function downloadPdfFromModal() {
      if (currentPdfUrl && currentPdfName) {
        window.reports.downloadPdfFromUrl(currentPdfUrl, currentPdfName);
        window.auth.showToast('PDF下载已开始', 'success');
      } else {
        window.auth.showToast('PDF文件不可用', 'error');
      }
    }
    
    async function downloadReportWrapper(reportId) {
      try {
        const result = await window.reports.downloadReport(reportId);
        
        downloadedReports.add(reportId);
        
        currentProfile = await window.auth.getUserProfile();
        
        window.auth.showToast('解锁成功！', 'success');
        
        await loadReports();
        
        showReportDetail(reportId);
      } catch (error) {
        console.error('Download error:', error);
        window.auth.showToast(error.message || '解锁失败', 'error');
      }
    }
    
    function closeModal() {
      document.getElementById('reportModal').classList.remove('active');
      currentPdfUrl = null;
      currentPdfName = null;
    }
    
    document.getElementById('searchInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        searchReports();
      }
    });
  </script>
</body>
</html>
