<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>报告浏览 - 专业星图</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .search-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .search-bar .form-input {
      flex: 1;
    }

    .filter-toolbar {
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-label {
      color: var(--on-surface-variant);
      font-size: 14px;
      white-space: nowrap;
    }

    .filter-select {
      width: auto;
      min-width: 140px;
    }

    .reports-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .report-card {
      cursor: pointer;
      transition: all 0.3s;
    }

    .report-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 32px var(--shadow);
    }

    .report-code {
      display: inline-block;
      background: var(--secondary-container);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--secondary);
      margin-bottom: 12px;
    }

    .report-title {
      font-size: 19px;
      font-weight: 700;
      color: var(--secondary);
      margin-bottom: 8px;
    }

    .report-meta {
      display: flex;
      justify-content: space-between;
      color: var(--on-surface-variant);
      font-size: 13px;
      margin-top: 16px;
    }

    .downloaded-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--success-container);
      color: var(--success);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      margin-left: 10px;
    }

    /* 报告阅读弹窗 - 大屏自适应 */
    .report-modal-content {
      max-width: min(95vw, 1100px);
      width: 100%;
      padding: 16px 20px;
      max-height: 95vh;
      display: flex;
      flex-direction: column;
    }
    .report-modal-header {
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--outline);
      flex-shrink: 0;
    }
    .report-modal-topline {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      flex: 1;
      min-width: 0;
    }
    .report-modal-title {
      margin: 0;
      font-size: 20px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 400px;
    }
    #modalContent {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .report-reader-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      background: #fafafa;
      border-radius: 12px;
      line-height: 1.9;
      font-size: 15px;
      min-height: 50vh;
      max-height: calc(95vh - 140px);
    }
    .report-unlocked-layout {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    .report-share-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--outline);
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .share-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--outline);
      background: var(--surface-container);
      color: var(--on-surface-variant);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .share-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-container);
    }
    .share-btn.copied {
      border-color: var(--success);
      color: var(--success);
      background: var(--success-container);
    }
    .invite-cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      padding: 8px 20px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--primary), #E65100);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .invite-cta:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(230, 81, 0, 0.3);
      color: #fff;
    }
    /* 预览模式底部 */
    .preview-share-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 16px;
      margin-top: 16px;
      border-top: 1px solid var(--outline);
    }
    .report-preview-content {
      background: var(--secondary-container);
      border-radius: 12px;
      padding: 24px;
      max-height: 55vh;
      overflow-y: auto;
      line-height: 1.8;
      font-size: 15px;
      flex: 1;
    }
    .report-locked-area {
      text-align: center;
      padding: 20px;
      background: var(--secondary-container);
      border-radius: 12px;
    }
    .download-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--on-surface-variant);
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 24px;
      transition: color 0.3s;
    }
    .back-link:hover { color: var(--primary); }

    .balance-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      padding: 14px 20px;
      background: linear-gradient(135deg, var(--primary-container), #FFE0B2);
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      color: var(--secondary);
    }
    .balance-bar span {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav">
      <a href="/" class="nav-logo">专业星图</a>
      <div class="nav-links">
        <a href="/user/dashboard.html" class="nav-link">个人中心</a>
        <a href="/user/purchase.html" class="nav-link">购买点数</a>
        <a href="/user/orders.html" class="nav-link">历史记录</a>
        <a href="#" id="logoutBtn" class="nav-link">退出</a>
      </div>
    </nav>

    <a href="/user/dashboard.html" class="back-link">← 返回个人中心</a>

    <h1 class="page-title">专业深度报告</h1>

    <div class="balance-bar">
      💎 当前点数余额：<span id="reportBalance">--</span>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" class="form-input" placeholder="搜索专业名称或代码...">
      <button class="btn btn-primary" id="searchBtn">搜索</button>
    </div>

    <div class="filter-toolbar">
      <div class="filter-group">
        <label for="categoryFilter" class="filter-label">学科分类：</label>
        <select id="categoryFilter" class="form-input filter-select">
          <option value="all">全部学科</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="reportSort" class="filter-label">排序：</label>
        <select id="reportSort" class="form-input filter-select">
          <option value="name">按名称</option>
          <option value="downloads">按解锁量</option>
          <option value="recent">按时间</option>
        </select>
      </div>
    </div>

    <div class="reports-grid" id="reportsGrid">
    </div>
  </div>

  <div class="modal" id="reportModal">
    <div class="modal-content report-modal-content">
      <div class="modal-header report-modal-header">
        <div class="report-modal-topline">
          <span id="modalBadge" class="report-code" style="margin:0;"></span>
          <h2 class="modal-title report-modal-title" id="modalTitle">报告详情</h2>
          <span id="modalCategory" style="font-size:13px;color:var(--on-surface-variant);"></span>
        </div>
        <button class="modal-close" id="modalCloseBtn">&times;</button>
      </div>
      <div id="modalContent">
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="/js/pages/reports-page.js"></script>
</body>
</html>
