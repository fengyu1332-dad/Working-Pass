
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>购买点数 - 专业星图</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .packages-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }
    
    .package-card {
      background: var(--surface-container);
      border: 2px solid var(--outline);
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      transition: all 0.3s;
      cursor: pointer;
      position: relative;
    }
    
    .package-card:hover {
      border-color: var(--primary);
      transform: translateY(-4px);
      box-shadow: 0 8px 32px var(--shadow);
    }
    
    .package-card.featured {
      border-color: var(--primary);
      background: linear-gradient(135deg, var(--primary-container), var(--surface-container));
    }
    
    .package-badge {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary);
      color: white;
      padding: 4px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }
    
    .package-points {
      font-size: 48px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }
    
    .package-unit {
      font-size: 18px;
      color: var(--on-surface-variant);
      margin-bottom: 24px;
    }
    
    .package-price {
      font-size: 32px;
      font-weight: 700;
      color: var(--secondary);
      margin-bottom: 8px;
    }
    
    .package-original-price {
      font-size: 16px;
      color: var(--on-surface-variant);
      text-decoration: line-through;
      margin-bottom: 24px;
    }
    
    .package-desc {
      color: var(--on-surface-variant);
      margin-bottom: 24px;
      line-height: 1.6;
    }
    
    .balance-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px;
      background: var(--primary-container);
      border-radius: 12px;
      margin-bottom: 32px;
    }
    
    .balance-label {
      font-size: 16px;
      color: var(--secondary);
    }
    
    .balance-value {
      font-size: 36px;
      font-weight: 700;
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav">
      <a href="/" class="nav-logo">专业星图</a>
      <div class="nav-links">
        <a href="/user/dashboard.html" class="nav-link">个人中心</a>
        <a href="/user/reports.html" class="nav-link">浏览报告</a>
        <a href="#" id="logoutBtn" class="nav-link">退出</a>
      </div>
    </nav>

    <h1 class="page-title">购买点数</h1>
    <p class="page-subtitle">选择合适的套餐，解锁更多专业深度报告</p>

    <div class="balance-card">
      <div>
        <div class="balance-label">当前点数余额</div>
        <div class="balance-value" id="currentBalance">0</div>
      </div>
      <div style="font-size: 48px;">💎</div>
    </div>

    <div class="packages-grid" id="packagesGrid">
    </div>
  </div>

  <div class="modal" id="paymentModal">
    <div class="modal-content" style="max-width: 500px;">
      <div class="modal-header">
        <h2 class="modal-title">确认购买</h2>
        <button class="modal-close" onclick="closeModal()">&amp;times;</button>
      </div>
      <div id="modalContent">
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/payments.js"></script>
  <script>
    let currentPackages = [];
    let selectedPackage = null;
    
    (async function() {
      window.auth.initSupabase();
      
      const isLoggedIn = await window.auth.checkAuthAndRedirect();
      if (!isLoggedIn) return;
      
      const profile = await window.auth.getUserProfile();
      if (profile) {
        document.getElementById('currentBalance').textContent = profile.points_balance || 0;
      }
      
      await loadPackages();
      
      document.getElementById('logoutBtn').addEventListener('click', async (e) => {
        e.preventDefault();
        try {
          await window.auth.logout();
        } catch (error) {
          window.auth.showToast('退出失败', 'error');
        }
      });
    })();
    
    async function loadPackages() {
      try {
        let packages = await window.payments.getPointPackages();
        
        if (!packages || packages.length === 0) {
          packages = [
            { id: 1, name: '新手包', points: 10, price: 9.9, original_price: 19.9, description: '适合初次体验，解锁10份报告', featured: false, active: true },
            { id: 2, name: '进阶包', points: 50, price: 39.9, original_price: 79.9, description: '适合深入了解，解锁50份报告', featured: true, active: true },
            { id: 3, name: '专业包', points: 200, price: 129.9, original_price: 299.9, description: '适合专业研究，解锁200份报告', featured: false, active: true }
          ];
        }
        
        currentPackages = packages;
        renderPackages(packages);
      } catch (error) {
        console.error('Load packages error:', error);
        window.auth.showToast('加载套餐失败', 'error');
      }
    }
    
    function renderPackages(packages) {
      const grid = document.getElementById('packagesGrid');
      grid.innerHTML = packages.map(pkg => `
        <div class="package-card ${pkg.featured ? 'featured' : ''}" onclick="selectPackage(${pkg.id})">
          ${pkg.featured ? '<div class="package-badge">推荐</div>' : ''}
          <div class="package-points">${pkg.points}</div>
          <div class="package-unit">点数</div>
          <div class="package-price">¥${pkg.price}</div>
          ${pkg.original_price ? `<div class="package-original-price">¥${pkg.original_price}</div>` : ''}
          <div class="package-desc">${pkg.description || '解锁专业深度报告'}</div>
          <button class="btn btn-primary" style="width: 100%;">立即购买</button>
        </div>
      `).join('');
    }
    
    function selectPackage(packageId) {
      selectedPackage = currentPackages.find(p => p.id === packageId);
      if (!selectedPackage) return;
      
      const modal = document.getElementById('paymentModal');
      const content = document.getElementById('modalContent');
      
      content.innerHTML = `
        <div style="text-align: center; padding: 20px 0;">
          <div style="font-size: 48px; margin-bottom: 16px;">💎</div>
          <h3 style="font-size: 24px; color: var(--secondary); margin-bottom: 8px;">${selectedPackage.name}</h3>
          <p style="color: var(--on-surface-variant); margin-bottom: 24px;">${selectedPackage.description || ''}</p>
          
          <div style="background: var(--surface-container-low); padding: 24px; border-radius: 12px; margin-bottom: 24px;">
            <div style="font-size: 36px; font-weight: 700; color: var(--primary);">${selectedPackage.points} 点数</div>
            <div style="font-size: 24px; color: var(--secondary); margin-top: 8px;">¥${selectedPackage.price}</div>
          </div>
          
          <div class="form-actions" style="flex-direction: column;">
            <button class="btn btn-primary" style="width: 100%;" onclick="confirmPurchase()">
              确认支付
            </button>
            <button class="btn btn-outline" style="width: 100%;" onclick="closeModal()">
              取消
            </button>
          </div>
        </div>
      `;
      
      modal.classList.add('active');
    }
    
    async function confirmPurchase() {
      if (!selectedPackage) return;
      
      try {
        window.auth.showToast('处理中...', 'success');
        
        const order = await window.payments.createOrder(selectedPackage.id);
        
        await window.payments.completeOrder(order.id);
        
        closeModal();
        window.auth.showToast('购买成功！点数已到账', 'success');
        
        const profile = await window.auth.getUserProfile();
        if (profile) {
          document.getElementById('currentBalance').textContent = profile.points_balance || 0;
        }
        
        setTimeout(() => {
          window.location.href = '/user/dashboard.html';
        }, 1500);
      } catch (error) {
        console.error('Purchase error:', error);
        window.auth.showToast(error.message || '购买失败', 'error');
      }
    }
    
    function closeModal() {
      document.getElementById('paymentModal').classList.remove('active');
      selectedPackage = null;
    }
  </script>
</body>
</html>
