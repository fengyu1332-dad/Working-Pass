<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>邀请好友 - 专业星图</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .packages-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 8px;
    }

    .package-card {
      background: var(--surface-container);
      border: 2px solid var(--outline);
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
      transition: all 0.3s;
      cursor: pointer;
      position: relative;
    }

    .package-card:hover {
      border-color: var(--primary);
      transform: translateY(-4px);
      box-shadow: 0 8px 32px var(--shadow);
    }

    .package-card.featured {
      border-color: var(--primary);
      background: linear-gradient(135deg, var(--primary-container), var(--surface-container));
    }

    .package-card.busy {
      pointer-events: none;
      opacity: 0.6;
    }

    .package-badge {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary);
      color: white;
      padding: 4px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .package-points {
      font-size: 44px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 2px;
    }

    .package-unit {
      font-size: 16px;
      color: var(--on-surface-variant);
      margin-bottom: 20px;
    }

    .package-price {
      font-size: 28px;
      font-weight: 700;
      color: var(--secondary);
      margin-bottom: 4px;
    }

    .package-original-price {
      font-size: 15px;
      color: var(--on-surface-variant);
      text-decoration: line-through;
      margin-bottom: 16px;
    }

    .package-desc {
      color: var(--on-surface-variant);
      font-size: 14px;
      line-height: 1.6;
    }

    .balance-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 28px;
      background: linear-gradient(135deg, var(--primary-container), #FFE0B2);
      border-radius: 16px;
      margin-bottom: 32px;
    }

    .balance-label {
      font-size: 15px;
      color: var(--secondary);
    }

    .balance-value {
      font-size: 36px;
      font-weight: 700;
      color: var(--primary);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--on-surface-variant);
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 24px;
      transition: color 0.3s;
    }
    .back-link:hover { color: var(--primary); }

    .purchase-feedback {
      text-align: center;
      padding: 20px;
      margin-top: 20px;
      border-radius: 12px;
      font-weight: 600;
      display: none;
    }
    .purchase-feedback.show { display: block; }
    .purchase-feedback.success {
      background: var(--success-container);
      color: var(--success);
    }
    .purchase-feedback.error {
      background: var(--error-container);
      color: var(--error);
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav">
      <a href="/" class="nav-logo">专业星图</a>
      <div class="nav-links">
        <a href="/user/dashboard.html" class="nav-link">个人中心</a>
        <a href="/user/reports.html" class="nav-link">浏览报告</a>
        <a href="/user/orders.html" class="nav-link">历史记录</a>
        <a href="#" id="logoutBtn" class="nav-link">退出</a>
      </div>
    </nav>

    <a href="/user/dashboard.html" class="back-link">← 返回个人中心</a>

    <div style="text-align:center;max-width:600px;margin:60px auto;padding:40px 20px;">
      <div style="font-size:72px;margin-bottom:24px;">🤝</div>
      <h1 style="color:var(--secondary);font-size:24px;margin-bottom:16px;">点数充值已升级为邀请好友</h1>
      <p style="color:var(--on-surface-variant);font-size:16px;line-height:1.8;margin-bottom:32px;">
        我们已将获取点数的方式从「付费购买」改为「分享推荐」。<br>
        每邀请一位朋友注册，你和他各获得 <strong style="color:var(--primary);">3 点</strong> 和 <strong style="color:var(--primary);">10 点</strong> 奖励。
      </p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <a href="/user/dashboard.html" class="btn btn-primary" style="text-decoration:none;padding:12px 28px;border-radius:12px;font-weight:600;">前往个人中心获取邀请链接</a>
        <a href="/user/reports.html" class="btn btn-secondary" style="text-decoration:none;padding:12px 28px;border-radius:12px;font-weight:600;">浏览报告</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="/js/i18n.js"></script>
  <script>
    // 简单的登出处理（无需加载完整模块）
    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault();
      if (window.auth && window.auth.logout) {
        window.auth.logout();
      } else {
        window.location.href = '/login.html';
      }
    });
  </script>
</body>
</html>
