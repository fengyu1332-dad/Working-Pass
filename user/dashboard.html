
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 - 专业星图</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
    }
    
    .stat-card {
      text-align: center;
      padding: 32px 24px;
    }
    
    .stat-value {
      font-size: 48px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }
    
    .stat-label {
      font-size: 16px;
      color: var(--on-surface-variant);
    }
    
    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px;
      background: var(--surface-container);
      border: 2px solid var(--outline);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      color: var(--on-surface);
    }
    
    .action-btn:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px var(--shadow);
    }
    
    .action-icon {
      font-size: 32px;
    }
    
    .action-text {
      text-align: left;
    }
    
    .action-title {
      font-weight: 600;
      color: var(--secondary);
      font-size: 16px;
    }
    
    .action-desc {
      font-size: 14px;
      color: var(--on-surface-variant);
    }
    
    .user-info {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }
    
    .user-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: white;
      font-weight: 700;
    }
    
    .user-details h2 {
      font-size: 24px;
      color: var(--secondary);
      margin-bottom: 4px;
    }
    
    .user-details p {
      color: var(--on-surface-variant);
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav">
      <a href="/" class="nav-logo">专业星图</a>
      <div class="nav-links">
        <a href="/user/reports.html" class="nav-link">浏览报告</a>
        <a href="/user/orders.html" class="nav-link">历史记录</a>
        <a href="#" id="logoutBtn" class="nav-link">退出</a>
      </div>
    </nav>

    <h1 class="page-title">个人中心</h1>

    <div class="card user-info">
      <div class="user-avatar" id="userAvatar">U</div>
      <div class="user-details">
        <h2 id="userName">用户</h2>
        <p id="userPhone">加载中...</p>
      </div>
    </div>

    <div class="dashboard-grid">
      <div class="card stat-card">
        <div class="stat-value" id="pointsBalance">0</div>
        <div class="stat-label">点数余额</div>
      </div>
      
      <div class="card stat-card">
        <div class="stat-value" id="totalDownloads">0</div>
        <div class="stat-label">下载次数</div>
      </div>
      
      <div class="card stat-card">
        <div class="stat-value" id="totalOrders">0</div>
        <div class="stat-label">订单数量</div>
      </div>
    </div>

    <h2 class="page-title" style="font-size: 24px; margin-top: 48px;">快捷操作</h2>
    <div class="dashboard-grid">
      <a href="/user/purchase.html" class="action-btn">
        <div class="action-icon">💎</div>
        <div class="action-text">
          <div class="action-title">购买点数</div>
          <div class="action-desc">充值点数，解锁更多报告</div>
        </div>
      </a>
      
      <a href="/user/reports.html" class="action-btn">
        <div class="action-icon">📚</div>
        <div class="action-text">
          <div class="action-title">浏览报告</div>
          <div class="action-desc">查看所有专业深度报告</div>
        </div>
      </a>
      
      <a href="/user/orders.html" class="action-btn">
        <div class="action-icon">📋</div>
        <div class="action-text">
          <div class="action-title">历史记录</div>
          <div class="action-desc">查看订单和下载记录</div>
        </div>
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/auth.js"></script>
  <script>
    (async function() {
      window.auth.initSupabase();
      
      const isLoggedIn = await window.auth.checkAuthAndRedirect();
      if (!isLoggedIn) return;
      
      const profile = await window.auth.getUserProfile();
      if (profile) {
        document.getElementById('pointsBalance').textContent = profile.points_balance || 0;
        document.getElementById('userPhone').textContent = profile.phone || '未设置手机号';
        document.getElementById('userName').textContent = profile.phone ? profile.phone.slice(0, 3) + '****' + profile.phone.slice(-4) : '用户';
        document.getElementById('userAvatar').textContent = (profile.phone || 'U')[0].toUpperCase();
        
        await loadUserStats(profile.id);
      }
      
      document.getElementById('logoutBtn').addEventListener('click', async (e) => {
        e.preventDefault();
        try {
          await window.auth.logout();
        } catch (error) {
          window.auth.showToast('退出失败', 'error');
        }
      });
    })();
    
    async function loadUserStats(userId) {
      const sb = window.auth.getSupabase();
      if (!sb) return;
      
      try {
        const { data: orders } = await sb
          .from('orders')
          .select('id', { count: 'exact' })
          .eq('user_id', userId)
          .eq('status', 'paid');
        document.getElementById('totalOrders').textContent = orders ? orders.length : 0;
        
        const { data: downloads } = await sb
          .from('download_records')
          .select('id', { count: 'exact' })
          .eq('user_id', userId);
        document.getElementById('totalDownloads').textContent = downloads ? downloads.length : 0;
      } catch (error) {
        console.error('Load stats error:', error);
      }
    }
  </script>
</body>
</html>
