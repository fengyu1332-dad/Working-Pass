<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>个人中心 - 专业星图</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 36px;
    }

    .stat-card {
      text-align: center;
      padding: 24px 20px;
      cursor: default;
    }

    .stat-value {
      font-size: 40px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 14px;
      color: var(--on-surface-variant);
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 36px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px;
      background: var(--surface-container);
      border: 2px solid var(--outline);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      color: var(--on-surface);
    }

    .action-btn:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px var(--shadow);
    }

    .action-icon {
      font-size: 32px;
    }

    .action-text {
      text-align: left;
    }

    .action-title {
      font-weight: 600;
      color: var(--secondary);
      font-size: 15px;
    }

    .action-desc {
      font-size: 13px;
      color: var(--on-surface-variant);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    .user-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: white;
      font-weight: 700;
    }

    .user-details h2 {
      font-size: 22px;
      color: var(--secondary);
      margin-bottom: 2px;
    }

    .user-details p {
      color: var(--on-surface-variant);
      font-size: 14px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--secondary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .activity-card {
      margin-bottom: 20px;
    }

    .activity-card .card {
      padding: 8px 20px;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav">
      <a href="/" class="nav-logo" data-i18n="site_name">专业星图</a>
      <div class="nav-links">
        <a href="/user/reports.html" class="nav-link" data-i18n="browse_reports_nav">浏览报告</a>
        <a href="/user/purchase.html" class="nav-link" data-i18n="nav_purchase">购买点数</a>
        <a href="/user/orders.html" class="nav-link" data-i18n="nav_orders">历史记录</a>
        <a href="#" id="logoutBtn" class="nav-link" data-i18n="nav_logout">退出</a>
      </div>
    </nav>

    <h1 class="page-title" data-i18n="dashboard_title">个人中心</h1>

    <div class="card user-info">
      <div class="user-avatar" id="userAvatar">U</div>
      <div class="user-details">
        <h2 id="userName">用户</h2>
        <p id="userPhone">加载中...</p>
      </div>
    </div>

    <div class="dashboard-grid">
      <div class="card stat-card">
        <div class="stat-value" id="pointsBalance">0</div>
        <div class="stat-label" data-i18n="points_balance">💎 点数余额</div>
      </div>

      <div class="card stat-card">
        <div class="stat-value" id="totalOrders">0</div>
        <div class="stat-label">📦 充值次数</div>
      </div>

      <div class="card stat-card">
        <div class="stat-value" id="totalDownloads">0</div>
        <div class="stat-label">📖 已购报告</div>
      </div>
    </div>

    <!-- 收藏预览 + 测评摘要 -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));gap:20px;margin-bottom:36px;">
      <div class="activity-card">
        <h2 class="section-title" data-i18n="dash_favorites">💖 我的收藏</h2>
        <div class="card" id="favoritesPreview">
          <p style="color:var(--on-surface-variant);text-align:center;padding:24px;">加载中...</p>
        </div>
      </div>
      <div class="activity-card">
        <h2 class="section-title" data-i18n="dash_assessment">📋 我的测评</h2>
        <div class="card" id="assessmentPreview">
          <p style="color:var(--on-surface-variant);text-align:center;padding:24px;">加载中...</p>
        </div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));gap:20px;margin-bottom:36px;">
      <div class="activity-card">
        <h2 class="section-title">📦 最近充值</h2>
        <div class="card" id="recentOrders">
          <p style="color:var(--on-surface-variant);text-align:center;padding:24px;">加载中...</p>
        </div>
      </div>
      <div class="activity-card">
        <h2 class="section-title">⭐ 已解锁报告</h2>
        <div class="card" id="recentDownloads">
          <p style="color:var(--on-surface-variant);text-align:center;padding:24px;">暂无已解锁报告</p>
        </div>
      </div>
    </div>

    <h2 class="section-title">⚡ 快捷操作</h2>
    <div class="action-grid">
      <a href="/user/purchase.html" class="action-btn">
        <div class="action-icon">💎</div>
        <div class="action-text">
          <div class="action-title">购买点数</div>
          <div class="action-desc">充值解锁更多报告</div>
        </div>
      </a>

      <a href="/user/reports.html" class="action-btn">
        <div class="action-icon">📚</div>
        <div class="action-text">
          <div class="action-title">浏览报告</div>
          <div class="action-desc">查看专业深度报告</div>
        </div>
      </a>

      <a href="/user/reports.html?unlocked=1" class="action-btn">
        <div class="action-icon">⭐</div>
        <div class="action-text">
          <div class="action-title">我的已购报告</div>
          <div class="action-desc">查看已解锁的报告</div>
        </div>
      </a>

      <a href="/user/orders.html" class="action-btn">
        <div class="action-icon">📋</div>
        <div class="action-text">
          <div class="action-title">历史记录</div>
          <div class="action-desc">订单和下载记录</div>
        </div>
      </a>

      <a href="/admin/index.html" class="action-btn" id="adminEntry" style="display:none;border-color:var(--primary);">
        <div class="action-icon">⚙️</div>
        <div class="action-text">
          <div class="action-title">管理后台</div>
          <div class="action-desc">数据管理和运营监控</div>
        </div>
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="/js/i18n.js"></script>
  <script type="module" src="/js/pages/dashboard.js"></script>
</body>
</html>
