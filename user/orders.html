<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>历史记录 - 专业星图</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
      border-bottom: 2px solid var(--outline);
    }

    .tab-btn {
      padding: 12px 24px;
      background: none;
      border: none;
      font-size: 16px;
      font-weight: 600;
      color: var(--on-surface-variant);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: all 0.3s;
      font-family: inherit;
    }

    .tab-btn:hover { color: var(--secondary); }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .records-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .record-item {
      padding: 18px 0;
      border-bottom: 1px solid var(--outline);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .record-item:last-child { border-bottom: none; }

    .record-title {
      font-weight: 600;
      color: var(--secondary);
      margin-bottom: 4px;
      font-size: 15px;
    }

    .record-meta {
      color: var(--on-surface-variant);
      font-size: 13px;
    }

    .record-points {
      font-size: 18px;
      font-weight: 700;
    }

    .positive { color: var(--success); }
    .negative { color: var(--error); }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--on-surface-variant);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--on-surface-variant);
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 24px;
      transition: color 0.3s;
    }
    .back-link:hover { color: var(--primary); }
  </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2515407343405907" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container">
    <nav class="nav">
      <a href="/" class="nav-logo">专业星图</a>
      <div class="nav-links">
        <a href="/user/dashboard.html" class="nav-link">个人中心</a>
        <a href="/user/reports.html" class="nav-link">浏览报告</a>
        <a href="#" id="logoutBtn" class="nav-link">退出</a>
      </div>
    </nav>

    <a href="/user/dashboard.html" class="back-link">← 返回个人中心</a>

    <h1 class="page-title">历史记录</h1>

    <div class="tabs">
      <button class="tab-btn active" data-tab="orders" onclick="switchTab('orders')">📦 充值记录</button>
      <button class="tab-btn" data-tab="downloads" onclick="switchTab('downloads')">📥 下载记录</button>
    </div>

    <div id="ordersTab" class="card" style="padding: 0 20px;">
      <div id="ordersList" class="records-list"></div>
    </div>

    <div id="downloadsTab" class="card" style="padding: 0 20px; display: none;">
      <div id="downloadsList" class="records-list"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="/js/i18n.js"></script>
  <script type="module" src="/js/pages/orders.js"></script>
</body>
</html>
