<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专业星图 - 大学专业职业前景全景查询</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0e1a;
            --bg-card: rgba(15, 23, 42, 0.8);
            --accent-gold: #fbbf24;
            --accent-cyan: #22d3ee;
            --accent-purple: #a855f7;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: var(--opacity); transform: scale(1); }
            50% { opacity: 0.2; transform: scale(0.8); }
        }

        .nebula {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }

        .nebula-1 {
            top: -200px;
            right: -200px;
            background: radial-gradient(circle, #6366f1, transparent);
        }

        .nebula-2 {
            bottom: -200px;
            left: -200px;
            background: radial-gradient(circle, #a855f7, transparent);
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        header {
            padding: 2rem 0;
            text-align: center;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            letter-spacing: 0.1em;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 300;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            flex: 1;
            min-width: 280px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 3rem;
            background: var(--bg-card);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 0.75rem;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.2);
        }

        .search-box svg {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .toggle-group {
            display: flex;
            background: var(--bg-card);
            border-radius: 0.75rem;
            padding: 0.25rem;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .toggle-btn {
            padding: 0.625rem 1.25rem;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, var(--accent-gold), #f59e0b);
            color: var(--bg-deep);
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            background: var(--bg-card);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 2rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--text-primary);
        }

        .filter-btn.active {
            background: var(--accent-cyan);
            border-color: var(--accent-cyan);
            color: var(--bg-deep);
        }

        .sort-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .sort-btn {
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .sort-btn:hover, .sort-btn.active {
            border-color: var(--accent-purple);
            color: var(--accent-purple);
        }

        .stats-bar {
            display: flex;
            gap: 2rem;
            margin-bottom: 2rem;
            padding: 1rem 1.5rem;
            background: var(--bg-card);
            border-radius: 1rem;
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .stat-icon {
            width: 2.5rem;
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-cyan));
            border-radius: 0.75rem;
            font-size: 1.25rem;
        }

        .stat-info {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 1.25rem;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-gold), var(--accent-cyan));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(34, 211, 238, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 30px rgba(34, 211, 238, 0.1);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .card-category {
            padding: 0.25rem 0.75rem;
            background: rgba(168, 85, 247, 0.2);
            border-radius: 2rem;
            font-size: 0.75rem;
            color: var(--accent-purple);
            font-weight: 500;
        }

        .card-trend {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem;
        }

        .trend-up {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .trend-stable {
            background: rgba(251, 191, 36, 0.2);
            color: var(--accent-gold);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .card-subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .card-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .card-stat {
            text-align: center;
            padding: 0.75rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 0.75rem;
        }

        .card-stat-value {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--accent-gold);
        }

        .card-stat-label {
            font-size: 0.625rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card-careers {
            display: flex;
            flex-wrap: wrap;
            gap: 0.375rem;
        }

        .career-tag {
            padding: 0.25rem 0.625rem;
            background: rgba(34, 211, 238, 0.1);
            border: 1px solid rgba(34, 211, 238, 0.2);
            border-radius: 2rem;
            font-size: 0.75rem;
            color: var(--accent-cyan);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 1.5rem;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-header {
            position: sticky;
            top: 0;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            padding: 1.5rem;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .modal-close {
            width: 2.5rem;
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(148, 163, 184, 0.1);
            border: none;
            border-radius: 0.5rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .section {
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent-gold);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .timeline {
            position: relative;
            padding-left: 2rem;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 0.375rem;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, var(--accent-gold), var(--accent-cyan), var(--accent-purple));
        }

        .timeline-item {
            position: relative;
            padding-bottom: 1.5rem;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -2rem;
            top: 0.25rem;
            width: 0.875rem;
            height: 0.875rem;
            background: var(--accent-gold);
            border-radius: 50%;
            border: 2px solid var(--bg-deep);
        }

        .timeline-year {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            color: var(--accent-cyan);
            margin-bottom: 0.25rem;
        }

        .timeline-job {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .timeline-desc {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .chart-container {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 1rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .industry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 0.75rem;
        }

        .industry-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 0.75rem;
            padding: 1rem;
            text-align: center;
        }

        .industry-name {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
        }

        .industry-percent {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .forecast-card {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 1rem;
            padding: 1rem;
            text-align: center;
        }

        .forecast-score {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .forecast-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .forecast-text {
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .tab-btn {
            padding: 0.5rem 1rem;
            background: rgba(148, 163, 184, 0.1);
            border: none;
            border-radius: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--accent-gold);
            color: var(--bg-deep);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .no-results-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 1.75rem;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .toggle-group {
                justify-content: center;
            }

            .stats-bar {
                flex-wrap: wrap;
                justify-content: center;
            }

            .forecast-grid {
                grid-template-columns: 1fr;
            }

            .modal {
                margin: 1rem;
                max-height: calc(100vh - 2rem);
            }
        }
    </style>
</head>

        <div class="sort-group">

            <button class="sort-btn" data-sort="growth">薪资涨幅</button>
        </div>

        <div class="grid" id="majorGrid"></div>

        <div class="no-results" id="noResults" style="display: none;">

        </div>
    </div>

                    careers: ["教师", "课程设计师", "教育产品经理", "培训师", "校长/管理者"]
                },
                intl: {
                    salary: { y1: 45, y5: 65, y10: 95, y20: 140, y40: 220 },
                    salaryLabel: "千美元/年",
                    industries: [
                        { name: "K-12 Education", percent: 35 },
                        { name: "EdTech", percent: 30 },
                        { name: "Higher Ed", percent: 20 },
                        { name: "Training", percent: 10 },
                        { name: "Publishing", percent: 5 }
                    ],
                    forecast: {
                        score: 7.6,
                        trend: "Stable",
                        outlook: "EdTech revolutionizing learning. Global demand for teachers. Lifelong learning becoming essential. International schools growing."
                    },
                    careers: ["Classroom Teacher", "Instructional Designer", "EdTech Product Manager", "Trainer", "Education Administrator"]
                }
            },
            {
                id: 16,
                name: "环境科学/环境工程",
                category: "agriculture",
                categoryName: "农学",
                subtitle: "守护蓝色星球的未来",
                trend: "up",
                cn: {
                    salary: { y1: 7, y5: 14, y10: 28, y20: 50, y40: 85 },
                    salaryLabel: "万元/年",
                    industries: [
                        { name: "环保企业", percent: 30 },
                        { name: "政府环保部门", percent: 25 },
                        { name: "新能源", percent: 25 },
                        { name: "咨询", percent: 15 },
                        { name: "研究机构", percent: 5 }
                    ],
                    forecast: {
                        score: 8.5,
                        trend: "快速增长",
                        outlook: "双碳目标开启绿色革命，新能源、碳中和赛道爆发。环境咨询、ESG投资、绿色金融成为新风口。建议向新能源与环境金融方向发展。"
                    },
                    careers: ["环境工程师", "ESG分析师", "碳交易员", "新能源工程师", "环保项目经理"]
                },
                intl: {
                    salary: { y1: 50, y5: 80, y10: 120, y20: 180, y40: 280 },
                    salaryLabel: "千美元/年",
                    industries: [
                        { name: "Consulting", percent: 30 },
                        { name: "Renewable Energy", percent: 30 },
                        { name: "Government", percent: 20 },
                        { name: "Manufacturing", percent: 15 },
                        { name: "Research", percent: 5 }
                    ],
                    forecast: {
                        score: 8.8,
                        trend: "Surging",
                        outlook: "Climate crisis driving unprecedented investment. ESG becoming mainstream. Green jobs growing 30% annually. Net zero by 2050 creating massive demand."
                    },
                    careers: ["Environmental Engineer", "ESG Analyst", "Sustainability Consultant", "Renewable Energy Engineer", "Climate Policy Advisor"]
                }
            }
        ];

        let currentMode = 'cn';
        let currentCategory = 'all';
        let currentSort = 'default';
        let searchQuery = '';

        function createStars() {
            const starsContainer = document.getElementById('stars');
            const count = 150;
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 2 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.setProperty('--opacity', Math.random() * 0.5 + 0.3);
                star.style.setProperty('--duration', Math.random() * 3 + 2 + 's');
                star.style.animationDelay = Math.random() * 5 + 's';
                starsContainer.appendChild(star);
            }
        }

        function formatSalary(value, mode) {
            if (mode === 'intl') {
                return '$' + value + 'K';
            }
            return value + '万';
        }

        function calculateGrowth(salary) {
            const growth = ((salary.y40 - salary.y1) / salary.y1 * 100).toFixed(0);
            return growth + '%';
        }

        function renderMajors() {
            const grid = document.getElementById('majorGrid');
            const noResults = document.getElementById('noResults');
            
            let filtered = majorsData.filter(major => {
                const matchesCategory = currentCategory === 'all' || major.category === currentCategory;
                const matchesSearch = searchQuery === '' || 
                    major.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    major.cn.careers.some(c => c.toLowerCase().includes(searchQuery.toLowerCase())) ||
                    major.subtitle.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            if (currentSort === 'salary') {
                filtered.sort((a, b) => b[currentMode].salary.y1 - a[currentMode].salary.y1);
            } else if (currentSort === 'growth') {
                filtered.sort((a, b) => {
                    const growthA = (a[currentMode].salary.y40 - a[currentMode].salary.y1) / a[currentMode].salary.y1;
                    const growthB = (b[currentMode].salary.y40 - b[currentMode].salary.y1) / b[currentMode].salary.y1;
                    return growthB - growthA;
                });
            }

            document.getElementById('majorCount').textContent = filtered.length;
            
            const avgGrowth = filtered.reduce((sum, m) => {
                const growth = (m[currentMode].salary.y40 - m[currentMode].salary.y1) / m[currentMode].salary.y1 * 100;
                return sum + growth;
            }, 0) / filtered.length;
            document.getElementById('avgGrowth').textContent = Math.round(avgGrowth) + '%';

            if (filtered.length === 0) {
                grid.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }
            noResults.style.display = 'none';

            grid.innerHTML = filtered.map(major => {
                const data = major[currentMode];
                const trendClass = major.trend === 'up' ? 'trend-up' : 'trend-stable';
                const trendText = major.trend === 'up' ? '↑ 上升' : '→ 稳定';
                const growth = calculateGrowth(data.salary);
                
                return `
                    <div class="card" onclick="openModal(${major.id})">
                        <div class="card-header">
                            <span class="card-category">${major.categoryName}</span>
                            <span class="card-trend ${trendClass}">${trendText}</span>
                        </div>
                        <h3 class="card-title">${major.name}</h3>
                        <p class="card-subtitle">${major.subtitle}</p>
                        <div class="card-stats">
                            <div class="card-stat">
                                <div class="card-stat-value">${formatSalary(data.salary.y1, currentMode)}</div>
                                <div class="card-stat-label">起薪</div>
                            </div>
                            <div class="card-stat">
                                <div class="card-stat-value">${formatSalary(data.salary.y10, currentMode)}</div>
                                <div class="card-stat-label">10年</div>
                            </div>
                            <div class="card-stat">
                                <div class="card-stat-value">${growth}</div>
                                <div class="card-stat-label">40年涨幅</div>
                            </div>
                        </div>
                        <div class="card-careers">
                            ${data.careers.slice(0, 3).map(c => `<span class="career-tag">${c}</span>`).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openModal(id) {
            const major = majorsData.find(m => m.id === id);
            if (!major) return;

            const data = major[currentMode];
            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            const modalOverlay = document.getElementById('modalOverlay');

            modalTitle.textContent = major.name;
            
            const growth = calculateGrowth(data.salary);
            const timeline = [
                { year: '1年', job: data.careers[0], desc: '初入职场，从基础工作做起，积累实践经验' },
                { year: '5年', job: data.careers[1] || data.careers[0], desc: '成为业务骨干，具备独立解决问题的能力' },
                { year: '10年', job: data.careers[2] || data.careers[1], desc: '晋升为中层管理者或专家级人才' },
                { year: '20年', job: data.careers[3] || data.careers[2], desc: '担任高级管理职位或成为行业专家' },
                { year: '40年', job: data.careers[4] || data.careers[3], desc: '行业领袖、企业高管或创业成功者' }
            ];

            modalBody.innerHTML = `
                <div class="section">
                    <h3 class="section-title">📊 前景评分</h3>
                    <div class="forecast-grid">
                        <div class="forecast-card">
                            <div class="forecast-score" style="color: var(--accent-gold);">${data.forecast.score}</div>
                            <div class="forecast-label">综合评分</div>
                        </div>
                        <div class="forecast-card">
                            <div class="forecast-score" style="color: var(--accent-cyan);">${data.forecast.trend}</div>
                            <div class="forecast-label">发展趋势</div>
                        </div>
                        <div class="forecast-card">
                            <div class="forecast-score" style="color: var(--accent-purple);">${growth}</div>
                            <div class="forecast-label">40年薪资涨幅</div>
                        </div>
                    </div>
                    <p class="forecast-text">${data.forecast.outlook}</p>
                </div>

                <div class="section">
                    <h3 class="section-title">💼 职业轨迹</h3>
                    <div class="tabs">
                        <button class="tab-btn active" onclick="switchTab('timeline')">时间线</button>
                        <button class="tab-btn" onclick="switchTab('chart')">薪资图表</button>
                    </div>
                    <div class="tab-content active" id="tab-timeline">
                        <div class="timeline">
                            ${timeline.map(t => `
                                <div class="timeline-item">
                                    <div class="timeline-year">${t.year}</div>
                                    <div class="timeline-job">${t.job}</div>
                                    <div class="timeline-desc">${t.desc}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="tab-content" id="tab-chart">
                        <div class="chart-container">
                            <canvas id="salaryChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h3 class="section-title">🏭 行业分布</h3>
                    <div class="industry-grid">
                        ${data.industries.map(ind => `
                            <div class="industry-item">
                                <div class="industry-name">${ind.name}</div>
                                <div class="industry-percent">${ind.percent}%</div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="section">
                    <h3 class="section-title">🎯 主要职业</h3>
                    <div class="card-careers" style="gap: 0.5rem;">
                        ${data.careers.map(c => `<span class="career-tag">${c}</span>`).join('')}
                    </div>
                </div>
            `;

            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';

            setTimeout(() => {
                renderSalaryChart(data.salary);
            }, 100);
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.includes(tab === 'timeline' ? '时间线' : '薪资图表'));
            });
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.toggle('active', content.id === 'tab-' + tab);
            });
            if (tab === 'chart') {
                setTimeout(() => {
                    const major = majorsData.find(m => m.id === parseInt(document.getElementById('modalTitle').dataset.id));
                    if (major) {
                        const canvas = document.getElementById('salaryChart');
                        if (canvas) {
                            renderSalaryChart(major[currentMode].salary);
                        }
                    }
                }, 50);
            }
        }

        let salaryChart = null;
        function renderSalaryChart(salaryData) {
            const ctx = document.getElementById('salaryChart');
            if (!ctx) return;

            if (salaryChart) {
                salaryChart.destroy();
            }

            salaryChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['1年', '5年', '10年', '20年', '40年'],
                    datasets: [{
                        label: '薪资',
                        data: [salaryData.y1, salaryData.y5, salaryData.y10, salaryData.y20, salaryData.y40],
                        borderColor: '#fbbf24',
                        backgroundColor: 'rgba(251, 191, 36, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#fbbf24',
                        pointBorderColor: '#0a0e1a',
                        pointBorderWidth: 2,
                        pointRadius: 6,
                        pointHoverRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleColor: '#f1f5f9',
                            bodyColor: '#fbbf24',
                            borderColor: 'rgba(148, 163, 184, 0.2)',
                            borderWidth: 1,
                            padding: 12,
                            displayColors: false
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                color: 'rgba(148, 163, 184, 0.1)'
                            },
                            ticks: {
                                color: '#94a3b8'
                            }
                        },
                        y: {
                            grid: {
                                color: 'rgba(148, 163, 184, 0.1)'
                            },
                            ticks: {
                                color: '#94a3b8'
                            }
                        }
                    }
                }
            });
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });

        document.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
                renderMajors();
            });
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                renderMajors();
            });
        });

        document.querySelectorAll('.sort-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSort = btn.dataset.sort;
                renderMajors();
            });
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderMajors();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        createStars();
        renderMajors();
    </script>
</body>
</html>
