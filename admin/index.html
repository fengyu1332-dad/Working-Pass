<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>管理后台 - 专业星图</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <a class="skip-link" href="#admin-main">跳到主要内容</a>
  <div class="admin-layout">
    <nav id="adminSidebar"></nav>
    <div class="admin-content" id="admin-main">
      <h1 style="font-size: 28px; color: var(--secondary); margin-bottom: 24px;">数据概览</h1>

      <div class="quick-actions">
        <a href="/admin/majors.html" class="quick-action-card">
          <span class="quick-action-icon">🎓</span>
          <span class="quick-action-text">管理专业库</span>
        </a>
        <a href="/admin/reports.html" class="quick-action-card">
          <span class="quick-action-icon">📚</span>
          <span class="quick-action-text">管理报告</span>
        </a>
        <a href="/admin/users.html" class="quick-action-card">
          <span class="quick-action-icon">👥</span>
          <span class="quick-action-text">管理用户</span>
        </a>
        <a href="/admin/packages.html" class="quick-action-card">
          <span class="quick-action-icon">💎</span>
          <span class="quick-action-text">管理套餐</span>
        </a>
      </div>

      <div class="admin-stats-grid">
        <div class="admin-stat-card">
          <div class="admin-stat-value" id="totalUsers">--</div>
          <div class="admin-stat-label">总用户数</div>
        </div>
        <div class="admin-stat-card">
          <div class="admin-stat-value" id="totalMajors">--</div>
          <div class="admin-stat-label">专业数量</div>
        </div>
        <div class="admin-stat-card">
          <div class="admin-stat-value" id="totalReports">--</div>
          <div class="admin-stat-label">报告数量</div>
        </div>
        <div class="admin-stat-card">
          <div class="admin-stat-value" id="totalOrders">--</div>
          <div class="admin-stat-label">总订单数</div>
        </div>
        <div class="admin-stat-card">
          <div class="admin-stat-value" id="totalDownloads">--</div>
          <div class="admin-stat-label">总下载次数</div>
        </div>
        <div class="admin-stat-card">
          <div class="admin-stat-value" id="totalRevenue">--</div>
          <div class="admin-stat-label">总收入 (元)</div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:32px;">
        <div class="admin-stat-card">
          <div class="admin-stat-value" style="font-size:28px;" id="todayDownloads">--</div>
          <div class="admin-stat-label">今日下载</div>
        </div>
        <div class="admin-stat-card">
          <div class="admin-stat-value" style="font-size:28px;" id="todayRevenue">--</div>
          <div class="admin-stat-label">今日收入 (元)</div>
        </div>
      </div>

      <div class="admin-section" style="margin-bottom:32px;">
        <h2 class="admin-section-title">近 7 天收入</h2>
        <div class="bar-chart" id="revenueBarChart"></div>
      </div>

      <div class="admin-section">
        <h2 class="admin-section-title">热门报告 TOP 10</h2>
        <table class="admin-table" id="topReportsTable">
          <thead>
            <tr><th>#</th><th>专业代码</th><th>专业名称</th><th>下载次数</th><th>热度</th></tr>
          </thead>
          <tbody id="topReportsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="/js/pages/admin-dashboard.js"></script>
</body>
</html>
