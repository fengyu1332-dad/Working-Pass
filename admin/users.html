<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 管理后台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #f5f5f5;
        }
        .header {
            background: #fff;
            padding: 0 30px;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 {
            font-size: 20px;
            color: #ff6b35;
        }
        .logout-btn {
            padding: 8px 20px;
            background: #fff;
            border: 1px solid #ff6b35;
            color: #ff6b35;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .logout-btn:hover {
            background: #ff6b35;
            color: #fff;
        }
        .nav {
            background: #fff;
            padding: 0 30px;
            display: flex;
            gap: 30px;
            border-bottom: 1px solid #eee;
        }
        .nav a {
            padding: 15px 0;
            color: #666;
            text-decoration: none;
            font-size: 15px;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }
        .nav a:hover,
        .nav a.active {
            color: #ff6b35;
            border-bottom-color: #ff6b35;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .section {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #fafafa;
            padding: 12px 15px;
            text-align: left;
            font-weight: 500;
            color: #666;
            font-size: 14px;
        }
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
            font-size: 14px;
        }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
        }
        .badge-admin { background: #e3f2fd; color: #1976d2; }
        .badge-user { background: #f5f5f5; color: #666; }
        .btn {
            padding: 5px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #ff6b35;
            color: #fff;
        }
        .btn-primary:hover {
            background: #e55a2b;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.show {
            display: flex;
        }
        .modal-content {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            width: 400px;
            max-width: 90%;
        }
        .modal-content h3 {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .modal-btns {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-cancel {
            padding: 8px 20px;
            background: #fff;
            border: 1px solid #ddd;
            color: #666;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-confirm {
            padding: 8px 20px;
            background: #ff6b35;
            border: none;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>⚙️ 管理后台</h1>
        <button class="logout-btn" onclick="logout()">退出登录</button>
    </header>
    <nav class="nav">
        <a href="index.html">仪表板</a>
        <a href="users.html" class="active">用户管理</a>
        <a href="reports.html">报告管理</a>
        <a href="orders.html">订单管理</a>
        <a href="packages.html">套餐管理</a>
    </nav>
    <div class="container">
        <div class="section">
            <h2>用户列表</h2>
            <table>
                <thead>
                    <tr>
                        <th>手机号</th>
                        <th>邮箱</th>
                        <th>角色</th>
                        <th>点数余额</th>
                        <th>注册时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="userTable"></tbody>
            </table>
        </div>
    </div>
    <div class="modal" id="pointsModal">
        <div class="modal-content">
            <h3>调整用户点数</h3>
            <div class="form-group">
                <label>当前点数</label>
                <input type="text" id="currentPoints" readonly>
            </div>
            <div class="form-group">
                <label>调整数量（正数增加，负数减少）</label>
                <input type="number" id="adjustAmount" placeholder="请输入调整数量">
            </div>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-confirm" onclick="confirmAdjust()">确认</button>
            </div>
        </div>
    </div>
    <script>
        let currentUserId = null;
        function checkAdminAuth() {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!user.token || user.role !== 'admin') {
                window.location.href = '../login.html';
                return false;
            }
            return true;
        }
        function logout() {
            localStorage.removeItem('user');
            window.location.href = '../login.html';
        }
        function loadUsers() {
            if (!checkAdminAuth()) return;
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            const tbody = document.getElementById('userTable');
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#999;">暂无用户数据</td></tr>';
                return;
            }
            tbody.innerHTML = users.map(user => `
                <tr>
                    <td>${user.phone}</td>
                    <td>${user.email || '-'}</td>
                    <td><span class="badge ${user.role === 'admin' ? 'badge-admin' : 'badge-user'}">${user.role === 'admin' ? '管理员' : '用户'}</span></td>
                    <td>${user.points || 0} 点</td>
                    <td>${user.registerTime || '-'}</td>
                    <td><button class="btn btn-primary" onclick="openAdjustModal('${user.id}')">调整点数</button></td>
                </tr>
            `).join('');
        }
        function openAdjustModal(userId) {
            currentUserId = userId;
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            const user = users.find(u => u.id === userId);
            if (user) {
                document.getElementById('currentPoints').value = user.points || 0;
                document.getElementById('adjustAmount').value = '';
                document.getElementById('pointsModal').classList.add('show');
            }
        }
        function closeModal() {
            document.getElementById('pointsModal').classList.remove('show');
            currentUserId = null;
        }
        function confirmAdjust() {
            if (!currentUserId) return;
            const adjustAmount = parseInt(document.getElementById('adjustAmount').value) || 0;
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            const userIndex = users.findIndex(u => u.id === currentUserId);
            if (userIndex !== -1) {
                users[userIndex].points = (users[userIndex].points || 0) + adjustAmount;
                localStorage.setItem('users', JSON.stringify(users));
                loadUsers();
                closeModal();
            }
        }
        document.addEventListener('DOMContentLoaded', loadUsers);
    </script>
</body>
</html>
