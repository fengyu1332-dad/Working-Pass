<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>用户管理 - 专业星图</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2515407343405907" crossorigin="anonymous"></script>
</head>
<body>
  <a class="skip-link" href="#admin-main">跳到主要内容</a>
  <div class="admin-layout">
    <nav id="adminSidebar"></nav>
    <div class="admin-content" id="admin-main">
      <div class="admin-page-header">
        <h1>用户管理</h1>
        <div class="admin-toolbar">
          <input type="text" id="userSearch" class="form-input" placeholder="搜索邮箱或手机号..." style="max-width:260px;">
          <button class="btn btn-primary" id="addUserBtn">+ 添加用户</button>
        </div>
      </div>

      <div class="admin-section">
        <table class="admin-table" id="usersTable">
          <thead>
            <tr><th>邮箱</th><th>手机号</th><th>点数余额</th><th>角色</th><th>注册时间</th><th>操作</th></tr>
          </thead>
          <tbody id="usersTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal" id="adminModal">
    <div class="modal-content" style="max-width:480px;">
      <div class="modal-header">
        <h2 class="modal-title" id="adminModalTitle">调整点数</h2>
        <button class="modal-close" id="adminModalClose">&times;</button>
      </div>
      <div id="adminModalBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="/js/pages/admin-users.js"></script>
</body>
</html>
