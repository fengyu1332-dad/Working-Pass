<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>点数套餐管理 - 专业星图</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <a class="skip-link" href="#admin-main">跳到主要内容</a>
  <div class="admin-layout">
    <nav id="adminSidebar"></nav>
    <div class="admin-content" id="admin-main">
      <div class="admin-page-header">
        <h1>点数套餐管理</h1>
        <button class="btn btn-primary" id="addPackageBtn">+ 新增套餐</button>
      </div>

      <div class="admin-section">
        <table class="admin-table" id="packagesTable">
          <thead>
            <tr><th>套餐名称</th><th>点数</th><th>价格</th><th>描述</th><th>上架</th><th>操作</th></tr>
          </thead>
          <tbody id="packagesTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal" id="adminModal">
    <div class="modal-content" style="max-width:520px;">
      <div class="modal-header">
        <h2 class="modal-title" id="adminModalTitle">编辑套餐</h2>
        <button class="modal-close" id="adminModalClose">&times;</button>
      </div>
      <div id="adminModalBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="/js/pages/admin-packages.js"></script>
</body>
</html>
