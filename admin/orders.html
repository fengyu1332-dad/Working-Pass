<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理 - 管理后台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #f5f5f5;
        }
        .header {
            background: #fff;
            padding: 0 30px;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 {
            font-size: 20px;
            color: #ff6b35;
        }
        .logout-btn {
            padding: 8px 20px;
            background: #fff;
            border: 1px solid #ff6b35;
            color: #ff6b35;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .logout-btn:hover {
            background: #ff6b35;
            color: #fff;
        }
        .nav {
            background: #fff;
            padding: 0 30px;
            display: flex;
            gap: 30px;
            border-bottom: 1px solid #eee;
        }
        .nav a {
            padding: 15px 0;
            color: #666;
            text-decoration: none;
            font-size: 15px;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }
        .nav a:hover,
        .nav a.active {
            color: #ff6b35;
            border-bottom-color: #ff6b35;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .stat-card h3 {
            font-size: 14px;
            color: #999;
            margin-bottom: 10px;
        }
        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            color: #333;
        }
        .stat-card:nth-child(1) .value { color: #ff6b35; }
        .stat-card:nth-child(2) .value { color: #4caf50; }
        .stat-card:nth-child(3) .value { color: #2196f3; }
        .section {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #fafafa;
            padding: 12px 15px;
            text-align: left;
            font-weight: 500;
            color: #666;
            font-size: 14px;
        }
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
            font-size: 14px;
        }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
        }
        .badge-paid { background: #e8f5e9; color: #388e3c; }
        .badge-pending { background: #fff3e0; color: #f57c00; }
        .badge-failed { background: #ffebee; color: #d32f2f; }
        @media (max-width: 768px) {
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>⚙️ 管理后台</h1>
        <button class="logout-btn" onclick="logout()">退出登录</button>
    </header>
    <nav class="nav">
        <a href="index.html">仪表板</a>
        <a href="users.html">用户管理</a>
        <a href="reports.html">报告管理</a>
        <a href="orders.html" class="active">订单管理</a>
        <a href="packages.html">套餐管理</a>
    </nav>
    <div class="container">
        <div class="stats">
            <div class="stat-card">
                <h3>总订单数</h3>
                <div class="value" id="totalOrders">0</div>
            </div>
            <div class="stat-card">
                <h3>已支付订单数</h3>
                <div class="value" id="paidOrders">0</div>
            </div>
            <div class="stat-card">
                <h3>总收入</h3>
                <div class="value" id="totalRevenue">¥0</div>
            </div>
        </div>
        <div class="section">
            <h2>订单列表</h2>
            <table>
                <thead>
                    <tr>
                        <th>订单ID</th>
                        <th>用户ID</th>
                        <th>套餐</th>
                        <th>金额</th>
                        <th>状态</th>
                        <th>创建时间</th>
                        <th>支付时间</th>
                    </tr>
                </thead>
                <tbody id="orderTable"></tbody>
            </table>
        </div>
    </div>
    <script>
        function checkAdminAuth() {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!user.token || user.role !== 'admin') {
                window.location.href = '../login.html';
                return false;
            }
            return true;
        }
        function logout() {
            localStorage.removeItem('user');
            window.location.href = '../login.html';
        }
        function loadOrders() {
            if (!checkAdminAuth()) return;
            const orders = JSON.parse(localStorage.getItem('orders') || '[]');
            const paidOrders = orders.filter(o => o.status === 'paid');
            const totalRevenue = paidOrders.reduce((sum, o) => sum + parseFloat(o.amount), 0);
            document.getElementById('totalOrders').textContent = orders.length;
            document.getElementById('paidOrders').textContent = paidOrders.length;
            document.getElementById('totalRevenue').textContent = '¥' + totalRevenue;
            const tbody = document.getElementById('orderTable');
            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999;">暂无订单数据</td></tr>';
                return;
            }
            const statusMap = {
                paid: { text: '已支付', class: 'badge-paid' },
                pending: { text: '待支付', class: 'badge-pending' },
                failed: { text: '失败', class: 'badge-failed' }
            };
            tbody.innerHTML = orders.map(order => {
                const status = statusMap[order.status] || statusMap.pending;
                return `
                    <tr>
                        <td>${order.id}</td>
                        <td>${order.userId}</td>
                        <td>${order.packageName}</td>
                        <td>¥${order.amount}</td>
                        <td><span class="badge ${status.class}">${status.text}</span></td>
                        <td>${order.createTime || '-'}</td>
                        <td>${order.payTime || '-'}</td>
                    </tr>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', loadOrders);
    </script>
</body>
</html>
