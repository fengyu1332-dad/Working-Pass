<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>订单管理 - 专业星图</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-paid { background: var(--success-container); color: var(--success); }
    .status-pending { background: #FFF3E0; color: #E65100; }
    .status-expired { background: #F5F5F5; color: #9E9E9E; }
    .status-cancelled { background: var(--error-container); color: var(--error); }
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 6px 16px;
      border: 1px solid var(--outline);
      border-radius: 20px;
      background: var(--surface-container);
      cursor: pointer;
      font-size: 13px;
      color: var(--on-surface-variant);
      transition: all 0.2s;
      font-family: inherit;
    }
    .filter-btn:hover { border-color: var(--primary); color: var(--primary); }
    .filter-btn.active { background: var(--primary-container); color: var(--primary); border-color: var(--primary); }
    .trade-no-mono { font-family: monospace; font-size: 12px; color: var(--on-surface-variant); }
    .revenue-summary {
      display: flex;
      gap: 20px;
      margin-bottom: 24px;
    }
    .revenue-card {
      flex: 1;
      background: var(--surface-container);
      border-radius: 12px;
      padding: 16px 20px;
      text-align: center;
    }
    .revenue-card .rev-value { font-size: 24px; font-weight: 700; color: var(--secondary); }
    .revenue-card .rev-label { font-size: 13px; color: var(--on-surface-variant); margin-top: 4px; }
  </style>
</head>
<body>
  <a class="skip-link" href="#admin-main">跳到主要内容</a>
  <div class="admin-layout">
    <nav id="adminSidebar"></nav>
    <div class="admin-content" id="admin-main">
      <div class="admin-page-header">
        <h1>订单管理</h1>
      </div>

      <div class="revenue-summary">
        <div class="revenue-card">
          <div class="rev-value" id="statTotalOrders">--</div>
          <div class="rev-label">总订单数</div>
        </div>
        <div class="revenue-card">
          <div class="rev-value" id="statPaidOrders">--</div>
          <div class="rev-label">已支付</div>
        </div>
        <div class="revenue-card">
          <div class="rev-value" id="statTotalRevenue">--</div>
          <div class="rev-label">总营收 (元)</div>
        </div>
        <div class="revenue-card">
          <div class="rev-value" id="statTodayRevenue">--</div>
          <div class="rev-label">今日营收 (元)</div>
        </div>
      </div>

      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="paid">已支付</button>
        <button class="filter-btn" data-filter="pending">待支付</button>
        <button class="filter-btn" data-filter="expired">已过期</button>
        <button class="filter-btn" data-filter="cancelled">已取消</button>
      </div>

      <div class="admin-section">
        <table class="admin-table" id="ordersTable">
          <thead>
            <tr>
              <th>订单ID</th>
              <th>用户</th>
              <th>套餐</th>
              <th>金额</th>
              <th>点数</th>
              <th>状态</th>
              <th>支付方式</th>
              <th>支付宝交易号</th>
              <th>创建时间</th>
              <th>支付时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody"></tbody>
        </table>
        <div style="text-align:center;padding:16px;" id="ordersPagination">
          <button class="btn btn-outline" id="loadMoreBtn" style="display:none;">加载更多</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="/js/pages/admin-orders.js"></script>
</body>
</html>
