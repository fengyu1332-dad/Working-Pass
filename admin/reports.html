<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>报告管理 - 专业星图</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <a class="skip-link" href="#admin-main">跳到主要内容</a>
  <div class="admin-layout">
    <nav id="adminSidebar"></nav>
    <div class="admin-content" id="admin-main">
      <div class="admin-page-header">
        <h1>报告管理</h1>
        <button class="btn btn-primary" id="addReportBtn">+ 新增报告</button>
        <button class="btn btn-secondary" id="generateReportBtn">📝 从专业数据生成</button>
      </div>

      <div class="admin-section">
        <table class="admin-table" id="reportsTable">
          <thead>
            <tr><th>专业代码</th><th>专业名称</th><th>学科门类</th><th>状态</th><th>下载次数</th><th>操作</th></tr>
          </thead>
          <tbody id="reportsTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal" id="adminModal">
    <div class="modal-content" style="max-width:800px;">
      <div class="modal-header">
        <h2 class="modal-title" id="adminModalTitle">编辑报告</h2>
        <button class="modal-close" id="adminModalClose">&times;</button>
      </div>
      <div id="adminModalBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="/js/pages/admin-reports.js"></script>
</body>
</html>
