<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 专业星图</title>
  <link rel="stylesheet" href="css/auth.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="logo-icon">🌟</span>
        <h1>专业星图</h1>
        <p class="subtitle">创建您的账号</p>
      </div>

      <form class="auth-form" id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="phone">手机号 *</label>
          <input 
            type="tel" 
            id="phone" 
            name="phone" 
            placeholder="请输入手机号"
            autocomplete="tel"
            required
          >
          <span class="form-error" id="phoneError"></span>
        </div>

        <div class="form-group">
          <label for="email">邮箱（选填）</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="请输入邮箱"
            autocomplete="email"
          >
          <span class="form-error" id="emailError"></span>
          <span class="input-hint">用于找回密码和接收通知</span>
        </div>

        <div class="form-group">
          <label for="password">密码 *</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="请输入密码"
            autocomplete="new-password"
            required
          >
          <span class="form-error" id="passwordError"></span>
          <span class="input-hint">至少8位，需包含数字和字母</span>
        </div>

        <div class="form-group">
          <label for="confirmPassword">确认密码 *</label>
          <input 
            type="password" 
            id="confirmPassword" 
            name="confirmPassword" 
            placeholder="请再次输入密码"
            autocomplete="new-password"
            required
          >
          <span class="form-error" id="confirmPasswordError"></span>
        </div>

        <div class="form-group" style="flex-direction: row; align-items: center; gap: 8px;">
          <input 
            type="checkbox" 
            id="agreeTerms" 
            name="agreeTerms" 
            style="width: 18px; height: 18px; accent-color: var(--primary-color);"
            required
          >
          <label for="agreeTerms" style="font-weight: normal; font-size: 14px; color: var(--text-secondary); margin: 0;">
            我已阅读并同意 <a href="terms.html" style="color: var(--primary-color);">服务条款</a> 和 <a href="privacy.html" style="color: var(--primary-color);">隐私政策</a>
          </label>
        </div>

        <button type="submit" class="auth-button" id="submitBtn">
          注册
        </button>

        <div class="auth-footer">
          <p>已有账号？<a href="login.html">立即登录</a></p>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast">
    <span class="toast-icon">✓</span>
    <div class="toast-content">
      <div class="toast-title">成功</div>
      <div class="toast-message" id="toastMessage"></div>
    </div>
    <button class="toast-close" onclick="hideToast()">×</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://your-project.supabase.co';
    const SUPABASE_ANON_KEY = 'your-anon-key';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function clearErrors() {
      document.querySelectorAll('.form-error').forEach(error => {
        error.classList.remove('show');
        error.textContent = '';
      });
      document.querySelectorAll('.form-group').forEach(group => {
        group.classList.remove('error');
      });
    }

    function showError(fieldId, message) {
      const errorElement = document.getElementById(fieldId + 'Error');
      const formGroup = document.getElementById(fieldId).closest('.form-group');
      
      if (errorElement) {
        errorElement.textContent = message;
        errorElement.classList.add('show');
      }
      
      if (formGroup) {
        formGroup.classList.add('error');
      }
    }

    function validatePhone(phone) {
      const phoneRegex = /^1[3-9]\d{9}$/;
      return phoneRegex.test(phone);
    }

    function validateEmail(email) {
      if (!email) return true;
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return emailRegex.test(email);
    }

    function validatePassword(password) {
      if (password.length < 8) {
        return { valid: false, message: '密码至少8位' };
      }
      if (!/\d/.test(password)) {
        return { valid: false, message: '密码需包含数字' };
      }
      if (!/[a-zA-Z]/.test(password)) {
        return { valid: false, message: '密码需包含字母' };
      }
      return { valid: true };
    }

    function showToast(type, title, message) {
      const toast = document.getElementById('toast');
      const toastIcon = toast.querySelector('.toast-icon');
      const toastTitle = toast.querySelector('.toast-title');
      const toastMessage = document.getElementById('toastMessage');

      toast.className = 'toast ' + type;
      toastTitle.textContent = title;
      toastMessage.textContent = message;

      if (type === 'success') {
        toastIcon.textContent = '✓';
      } else if (type === 'error') {
        toastIcon.textContent = '✕';
      }

      toast.classList.remove('hide');
      toast.classList.add('show');

      setTimeout(() => {
        hideToast();
      }, 3000);
    }

    function hideToast() {
      const toast = document.getElementById('toast');
      toast.classList.remove('show');
      toast.classList.add('hide');
    }

    function setButtonLoading(loading) {
      const btn = document.getElementById('submitBtn');
      if (loading) {
        btn.classList.add('loading');
        btn.disabled = true;
        btn.textContent = '注册中...';
      } else {
        btn.classList.remove('loading');
        btn.disabled = false;
        btn.textContent = '注册';
      }
    }

    async function handleRegister(event) {
      event.preventDefault();
      clearErrors();

      const phone = document.getElementById('phone').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const agreeTerms = document.getElementById('agreeTerms').checked;

      let isValid = true;

      if (!phone) {
        showError('phone', '请输入手机号');
        isValid = false;
      } else if (!validatePhone(phone)) {
        showError('phone', '手机号格式不正确');
        isValid = false;
      }

      if (email && !validateEmail(email)) {
        showError('email', '邮箱格式不正确');
        isValid = false;
      }

      if (!password) {
        showError('password', '请输入密码');
        isValid = false;
      } else {
        const passwordValidation = validatePassword(password);
        if (!passwordValidation.valid) {
          showError('password', passwordValidation.message);
          isValid = false;
        }
      }

      if (!confirmPassword) {
        showError('confirmPassword', '请再次输入密码');
        isValid = false;
      } else if (password !== confirmPassword) {
        showError('confirmPassword', '两次输入的密码不一致');
        isValid = false;
      }

      if (!agreeTerms) {
        showToast('error', '注册失败', '请先阅读并同意服务条款和隐私政策');
        isValid = false;
      }

      if (!isValid) {
        return;
      }

      setButtonLoading(true);

      try {
        const { data, error } = await supabase.auth.signUp({
          phone: phone,
          email: email || null,
          password: password,
          options: {
            data: {
              phone: phone,
              email: email || null
            }
          }
        });

        if (error) throw error;

        if (data.user && data.session) {
          showToast('success', '注册成功', '正在跳转到首页...');
          
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1500);
        } else if (data.user && !data.session) {
          showToast('success', '验证邮件已发送', '请前往邮箱验证您的账号');

          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        }

      } catch (error) {
        console.error('注册失败:', error);
        
        let errorMessage = '注册失败，请稍后重试';
        
        if (error.message.includes('already registered')) {
          errorMessage = '该手机号已被注册';
        } else if (error.message.includes('rate limit')) {
          errorMessage = '注册尝试次数过多，请稍后再试';
        } else if (error.message.includes('phone')) {
          errorMessage = '手机号格式不正确或已被使用';
        }

        showToast('error', '注册失败', errorMessage);
        setButtonLoading(false);
      }
    }

    window.hideToast = hideToast;
  </script>
</body>
</html>
