<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="重置专业星图账号密码">
  <meta property="og:title" content="重置密码 - 专业星图">
  <meta property="og:description" content="重置专业星图账号密码">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:url" content="https://working-pass.vercel.app/reset-password">
  <meta property="og:image" content="https://working-pass.vercel.app/og-image.svg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="重置密码 - 专业星图">
  <meta name="twitter:description" content="重置专业星图账号密码">
  <meta name="twitter:image" content="https://working-pass.vercel.app/og-image.svg">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>重置密码 - 专业星图</title>
  <link rel="canonical" href="https://working-pass.vercel.app/reset-password">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --surface: #FFF8F5; --surface-container: #FFFFFF; --primary: #E67E22;
      --secondary: #705A49; --on-surface: #2C2621; --on-surface-variant: #8B7E74;
      --outline: #DED0C6; --error: #D32F2F; --success: #2E7D32;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      background: var(--surface); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .container { max-width: 440px; width: 100%; }
    .card {
      background: var(--surface-container); border-radius: 16px; padding: 40px 32px;
      box-shadow: 0 2px 16px rgba(112,90,73,0.06); text-align: center;
    }
    .logo { font-family: "Literata", serif; font-size: 22px; color: var(--secondary); margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: var(--on-surface-variant); margin-bottom: 24px; }
    .input {
      width: 100%; padding: 12px 16px; border: 1px solid var(--outline); border-radius: 10px;
      font-size: 15px; text-align: center; outline: none; transition: border 0.2s;
    }
    .input:focus { border-color: var(--primary); }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 15px;
      font-weight: 500; cursor: pointer; transition: all 0.2s; margin-top: 16px;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { font-size: 14px; margin-top: 16px; display: none; padding: 10px; border-radius: 8px; }
    .msg-error { background: #FFEBEE; color: var(--error); }
    .msg-success { background: #E8F5E9; color: var(--success); }
    .link { color: var(--primary); text-decoration: none; font-size: 14px; }
    .link:hover { text-decoration: underline; }
    .back { margin-top: 20px; }
    .skip-link {
      position: absolute; top: -100px; left: 16px; z-index: 10000;
      padding: 12px 24px; background: var(--primary); color: #fff;
      font-weight: 600; font-size: 15px; border-radius: 8px;
      text-decoration: none; transition: top 0.2s;
    }
    .skip-link:focus { top: 16px; outline: 3px solid #fff; outline-offset: -6px; }
  </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2515407343405907" crossorigin="anonymous"></script>
</head>
<body>
  <a class="skip-link" href="#main-content" data-i18n="skip_to_main">跳到主要内容</a>
  <div class="container" id="main-content">
    <div class="card">
      <div class="logo" data-i18n="reset_password_title">🔑 重置密码</div>
      <p class="subtitle" data-i18n="reset_password_subtitle">请输入注册时使用的邮箱，我们将发送密码重置链接</p>

      <div id="errorMsg" class="msg msg-error"></div>
      <div id="successMsg" class="msg msg-success"></div>

      <form id="resetForm">
        <input type="email" id="email" class="input" data-i18n-placeholder="email_placeholder" placeholder="请输入邮箱地址" required autocomplete="email">
        <button type="submit" class="btn btn-primary" id="submitBtn" data-i18n="send_reset_link">发送重置链接</button>
      </form>

      <div class="back">
        <a href="login.html" class="link" data-i18n="back_to_login">← 返回登录</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    import { initSupabase } from './js/supabase-client.js';
    import { sendPasswordResetEmail } from './js/auth.js';
    import { t } from './js/i18n.js';

    initSupabase();

    const form = document.getElementById('resetForm');
    const emailInput = document.getElementById('email');
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      if (!email) return;

      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = t('reset_sending', '发送中...');

      try {
        await sendPasswordResetEmail(email);
        successMsg.textContent = t('reset_email_sent', '✓ 重置链接已发送，请检查邮箱（含垃圾邮件箱）');
        successMsg.style.display = 'block';
        submitBtn.textContent = t('reset_sent', '已发送');
      } catch (err) {
        errorMsg.textContent = err.message || t('reset_fail', '发送失败，请稍后重试');
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = t('send_reset_link', '发送重置链接');
      }
    });
  </script>
</body>
</html>
